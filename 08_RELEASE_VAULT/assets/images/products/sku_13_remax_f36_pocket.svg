<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#8B5CF6"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">REMAX</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Quạt kẹp KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Folding Pocket / Stand Fan -->
      <rect x="180" y="210" width="40" height="80" rx="12" fill="#8B5CF6"/>
      <circle cx="200" cy="150" r="45" fill="#F3E8FF" stroke="#7C3AED" stroke-width="4"/>
      <!-- Fan Mesh Radial Lines -->
      <circle cx="200" cy="150" r="8" fill="#7C3AED"/>
      <path d="M200 150 L220 120 M200 150 L230 160 M200 150 L180 180 M200 150 L170 140" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"/>
      <!-- Fold Joint -->
      <circle cx="200" cy="205" r="6" fill="#FFFFFF"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">F36 (Folding Desk Stand)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#8B5CF6" text-anchor="end">129.000 ₫</text>
</svg>
