<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#06B6D4"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">REMAX</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Đèn bàn</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Clamp Base for Bunk Bed / Desk -->
      <path d="M150 250 L180 250 L180 280 L150 280 Z" fill="#06B6D4"/>
      <rect x="145" y="280" width="40" height="12" rx="3" fill="#0E7490"/>
      <!-- Flexible S-curve Stem -->
      <path d="M165 250 Q130 180 190 170 Q240 160 210 120" fill="none" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>
      <!-- Ring LED Head (Donut Shape) -->
      <circle cx="210" cy="120" r="22" fill="#FFFFFF" stroke="#06B6D4" stroke-width="5"/>
      <circle cx="210" cy="120" r="10" fill="#ECFEFF"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">RT-E190 (Clip 360°)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#06B6D4" text-anchor="end">145.000 ₫</text>
</svg>
