<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
      <defs>
        <linearGradient id="night-sky-a" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#050d1a"/>
          <stop offset="50%" stop-color="#0a1931"/>
          <stop offset="100%" stop-color="#152b4f"/>
        </linearGradient>
        <linearGradient id="water-glow-a" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0c2044"/>
          <stop offset="100%" stop-color="#030b17"/>
        </linearGradient>
        <linearGradient id="dragon-gold-a" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="50%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
        <filter id="city-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
      </defs>
      
      <!-- Night Sky -->
      <rect width="1200" height="500" fill="url(#night-sky-a)"/>
      
      <!-- Distant City Skyline Lights -->
      <g opacity="0.6">
        <rect x="100" y="180" width="40" height="120" fill="#1e3a8a"/>
        <rect x="150" y="140" width="60" height="160" fill="#1e293b"/>
        <rect x="220" y="190" width="50" height="110" fill="#1e3a8a"/>
        <rect x="900" y="160" width="50" height="140" fill="#1e3a8a"/>
        <rect x="960" y="120" width="70" height="180" fill="#1e293b"/>
        <rect x="1040" y="170" width="40" height="130" fill="#1e3a8a"/>
        <!-- Window Lights -->
        <circle cx="160" cy="160" r="2" fill="#fef08a"/>
        <circle cx="180" cy="180" r="2" fill="#fef08a"/>
        <circle cx="980" cy="150" r="2" fill="#fef08a"/>
        <circle cx="1000" cy="190" r="2" fill="#fef08a"/>
      </g>
      
      <!-- Han River Water Surface -->
      <rect x="0" y="300" width="1200" height="200" fill="url(#water-glow-a)"/>
      
      <!-- Water Light Reflections -->
      <ellipse cx="600" cy="340" rx="350" ry="16" fill="#f59e0b" opacity="0.3" filter="url(#city-blur)"/>
      <ellipse cx="600" cy="380" rx="280" ry="12" fill="#ef4444" opacity="0.25" filter="url(#city-blur)"/>
      <ellipse cx="600" cy="430" rx="200" ry="10" fill="#38bdf8" opacity="0.2" filter="url(#city-blur)"/>
      
      <!-- Illuminated Dragon Bridge Arch Silhouette -->
      <path d="M 120 300 Q 360 80 600 240 Q 840 80 1080 300" stroke="url(#dragon-gold-a)" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M 120 300 Q 360 100 600 250 Q 840 100 1080 300" stroke="#f59e0b" stroke-width="4" fill="none" opacity="0.8"/>
      
      <!-- Bridge Road Deck -->
      <line x1="80" y1="300" x2="1120" y2="300" stroke="#cbd5e1" stroke-width="6"/>
      <line x1="80" y1="304" x2="1120" y2="304" stroke="#475569" stroke-width="4"/>
      
      <!-- Floating Board Badge -->
      <g transform="translate(420, 40)">
        <rect width="360" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5"/>
        <text x="180" y="26" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">BOARD A &#8226; SÔNG HÀN AFTERGLOW</text>
      </g>
    </svg>