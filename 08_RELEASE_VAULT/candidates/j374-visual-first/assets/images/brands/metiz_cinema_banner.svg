<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="540" cy="80" r="140" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="100" cy="340" r="120" fill="#ffffff" fill-opacity="0.04"/>
  
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.2"/>
    <text x="65" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">RẠP VEN SÔNG HÀN</text>
  </g>

  <g transform="translate(320, 190) scale(1.4)" filter="url(#glow)">
    <g transform="translate(-40, -40)">
      <rect x="18" y="22" width="44" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="3"/>
      <polygon points="36,32 48,40 36,48" fill="#4F46E5"/>
    </g>
  </g>

  <g transform="translate(60, 310)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Metiz Cinema Đà Nẵng</text>
    <text x="0" y="32" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Vé U22 2D 55K & Phòng Chiếu Tiêu Chuẩn</text>
  </g>
  <rect x="0" y="394" width="640" height="6" fill="#4338CA"/>
</svg>