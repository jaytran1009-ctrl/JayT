<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg_phin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="60%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <filter id="shadow_phin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg_phin)"/>
  <circle cx="530" cy="90" r="140" fill="#D97706" fill-opacity="0.1"/>
  
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#D97706" fill-opacity="0.35"/>
    <text x="80" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">CÀ PHÊ PHIN DI SẢN</text>
  </g>
  <g transform="translate(430, 40)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#000000" fill-opacity="0.45"/>
    <text x="80" y="17" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HÌNH MINH HỌA CHUẨN</text>
  </g>

  <!-- Coffee Bag Vector Graphic -->
  <g transform="translate(320, 205)" filter="url(#shadow_phin)">
    <g transform="translate(-55, -85)">
      <!-- Coffee Pouch Body -->
      <polygon points="10,0 100,0 110,150 0,150" fill="#991B1B"/>
      <!-- Top Fold Seal -->
      <rect x="5" y="0" width="100" height="22" rx="4" fill="#B45309"/>
      <!-- Central Badge -->
      <rect x="20" y="45" width="70" height="85" rx="8" fill="#FEF3C7"/>
      <circle cx="55" cy="75" r="18" fill="#B91C1C"/>
      <text x="55" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">HL</text>
      <text x="55" y="105" fill="#78350F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">DI SẢN</text>
      <text x="55" y="118" fill="#92400E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">200g</text>
    </g>
  </g>

  <g transform="translate(50, 315)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Cà phê Phin Di Sản Highlands</text>
    <text x="0" y="30" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Gói 200g bột rang xay nguyên chất &#8226; 70.000₫</text>
  </g>
  <rect x="0" y="394" width="640" height="6" fill="#D97706"/>
</svg>