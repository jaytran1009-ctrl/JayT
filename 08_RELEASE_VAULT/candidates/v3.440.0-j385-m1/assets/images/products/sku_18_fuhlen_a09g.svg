<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#EF4444"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FUHLEN</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Chuột không dây</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Fuhlen Classic Durable Mouse -->
      <path d="M150 215 C150 155 170 130 200 130 C230 130 250 155 250 215 C250 265 230 285 200 285 C170 285 150 265 150 215 Z" fill="#475569" stroke="#EF4444" stroke-width="4"/>
      <line x1="200" y1="130" x2="200" y2="180" stroke="#EF4444" stroke-width="2"/>
      <rect x="196" y="150" width="8" height="20" rx="4" fill="#EF4444"/>
      <!-- Red Accent Side Grip -->
      <path d="M152 180 L152 240" stroke="#EF4444" stroke-width="4"/>
      <path d="M248 180 L248 240" stroke="#EF4444" stroke-width="4"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">A09G (12M Battery)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EF4444" text-anchor="end">135.000 ₫</text>
</svg>
