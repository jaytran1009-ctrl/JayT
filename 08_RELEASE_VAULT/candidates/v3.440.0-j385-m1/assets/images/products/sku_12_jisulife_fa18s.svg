<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#F43F5E"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">JISULIFE</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Quạt kẹp KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- JISULIFE Modern Matte Fan -->
      <rect x="165" y="270" width="70" height="22" rx="10" fill="#FDA4AF"/>
      <rect x="195" y="225" width="10" height="50" fill="#E11D48"/>
      <circle cx="200" cy="165" r="52" fill="#FFF1F2" stroke="#F43F5E" stroke-width="4"/>
      <!-- Modern 4 Blades -->
      <circle cx="200" cy="165" r="10" fill="#F43F5E"/>
      <line x1="200" y1="120" x2="200" y2="210" stroke="#FB7185" stroke-width="6" stroke-linecap="round"/>
      <line x1="155" y1="165" x2="245" y2="165" stroke="#FB7185" stroke-width="6" stroke-linecap="round"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">FA18S (4000mAh 4-Speed)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F43F5E" text-anchor="end">319.000 ₫</text>
</svg>
