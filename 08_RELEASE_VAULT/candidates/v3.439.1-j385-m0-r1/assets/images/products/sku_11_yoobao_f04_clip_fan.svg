<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#10B981"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">YOOBAO</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Quạt kẹp KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Yoobao Heavy-Duty Clamp -->
      <rect x="160" y="270" width="80" height="24" rx="8" fill="#1E293B"/>
      <!-- Swivel Arm -->
      <rect x="193" y="235" width="14" height="40" rx="4" fill="#64748B"/>
      <!-- Fan Cage Outer Ring -->
      <circle cx="200" cy="170" r="55" fill="#F8FAFC" stroke="#10B981" stroke-width="4"/>
      <!-- Blades -->
      <circle cx="200" cy="170" r="12" fill="#10B981"/>
      <path d="M200 170 Q230 140 215 125 Q190 140 200 170" fill="#047857"/>
      <path d="M200 170 Q230 200 245 185 Q220 170 200 170" fill="#047857"/>
      <path d="M200 170 Q170 200 155 185 Q180 170 200 170" fill="#047857"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">F04 (6400mAh 32h)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">269.000 ₫</text>
</svg>
