<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#A855F7"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">INPHIC</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Chuột không dây</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Inphic Ultra-Slim Metallic Mouse -->
      <path d="M155 220 C155 160 175 135 200 135 C225 135 245 160 245 220 C245 265 225 285 200 285 C175 285 155 265 155 220 Z" fill="#0F172A" stroke="#A855F7" stroke-width="4"/>
      <!-- Metallic Wheel -->
      <rect x="194" y="150" width="12" height="24" rx="4" fill="#CBD5E1" stroke="#A855F7" stroke-width="2"/>
      <!-- 4-LED Battery Indicator Dots -->
      <circle cx="191" cy="220" r="2.5" fill="#A855F7"/>
      <circle cx="197" cy="220" r="2.5" fill="#A855F7"/>
      <circle cx="203" cy="220" r="2.5" fill="#A855F7"/>
      <circle cx="209" cy="220" r="2.5" fill="#A855F7"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">M1P (Type-C Rechargeable)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#A855F7" text-anchor="end">179.000 ₫</text>
</svg>
