<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
      <defs>
        <linearGradient id="emerald-grad-cl" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0fdf4"/>
          <stop offset="50%" stop-color="#dcfce7"/>
          <stop offset="100%" stop-color="#a7f3d0"/>
        </linearGradient>
        <linearGradient id="bus-green" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#15803d"/>
          <stop offset="60%" stop-color="#16a34a"/>
          <stop offset="100%" stop-color="#22c55e"/>
        </linearGradient>
        <filter id="bus-drop-cl" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#064e3b" flood-opacity="0.2"/>
        </filter>
      </defs>
      
      <rect width="960" height="540" fill="url(#emerald-grad-cl)"/>
      <circle cx="480" cy="270" r="220" fill="#10b981" opacity="0.12"/>
      
      <!-- Top Badge -->
      <g transform="translate(250, 36)" filter="url(#bus-drop-cl)">
        <rect width="460" height="46" rx="23" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
        <text x="230" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#166534" text-anchor="middle" letter-spacing="1">🚌 GIAO THÔNG XANH &#8226; XE BUÝT TRỢ GIÁ DANABUS</text>
      </g>
      
      <!-- Modern Aerodynamic Electric/Eco Bus -->
      <g transform="translate(230, 160)" filter="url(#bus-drop-cl)">
        <!-- Bus Body -->
        <rect x="0" y="0" width="500" height="210" rx="36" fill="url(#bus-green)"/>
        <!-- Window Strip -->
        <rect x="24" y="24" width="452" height="96" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <line x1="170" y1="24" x2="170" y2="120" stroke="#15803d" stroke-width="6"/>
        <line x1="320" y1="24" x2="320" y2="120" stroke="#15803d" stroke-width="6"/>
        <path d="M 430 24 L 476 24 C 476 24 476 120 440 120 L 430 120 Z" fill="#bae6fd"/>
        
        <!-- Route Matrix Sign -->
        <rect x="190" y="34" width="130" height="26" rx="6" fill="#0f172a"/>
        <text x="255" y="52" font-family="monospace" font-size="13" font-weight="bold" fill="#facc15" text-anchor="middle">R16 SÂN BAY</text>
        
        <!-- Eco Leaf Logo -->
        <circle cx="85" cy="160" r="24" fill="#ffffff" opacity="0.95"/>
        <path d="M 77 165 C 77 150 94 146 94 146 C 94 146 94 165 77 165 Z" fill="#15803d"/>
        
        <!-- Wheels -->
        <circle cx="125" cy="210" r="44" fill="#1e293b"/>
        <circle cx="125" cy="210" r="20" fill="#94a3b8"/>
        <circle cx="375" cy="210" r="44" fill="#1e293b"/>
        <circle cx="375" cy="210" r="20" fill="#94a3b8"/>
        
        <!-- Headlights -->
        <rect x="486" y="145" width="14" height="32" rx="6" fill="#fef08a"/>
      </g>
      
      <!-- Bottom Narrative -->
      <text x="480" y="495" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">
        Tuyến R16: Sân Bay &#8596; Bến Xe &#8226; Tuyến R04: Cầu Rồng &#8596; Mỹ Khê (Vé chỉ 6.000đ/lượt)
      </text>
    </svg>