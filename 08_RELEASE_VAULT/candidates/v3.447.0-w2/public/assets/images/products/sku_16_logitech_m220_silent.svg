<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#00B4D8"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">LOGITECH</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Chuột không dây</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Logitech M220 Silent Mouse -->
      <path d="M150 220 C150 150 170 120 200 120 C230 120 250 150 250 220 C250 270 230 290 200 290 C170 290 150 270 150 220 Z" fill="#1E293B" stroke="#00B4D8" stroke-width="4"/>
      <!-- Split Buttons -->
      <line x1="200" y1="120" x2="200" y2="180" stroke="#00B4D8" stroke-width="3"/>
      <!-- Scroll Wheel -->
      <rect x="194" y="145" width="12" height="24" rx="6" fill="#00B4D8"/>
      <!-- Logitech Logo Arc -->
      <circle cx="200" cy="240" r="14" fill="none" stroke="#64748B" stroke-width="3"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">M220 Silent (1000 DPI)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#00B4D8" text-anchor="end">289.000 ₫</text>
</svg>
