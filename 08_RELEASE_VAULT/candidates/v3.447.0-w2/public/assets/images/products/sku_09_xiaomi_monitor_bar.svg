<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#F97316"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">XIAOMI</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Đèn bàn</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Xiaomi Monitor Light Bar -->
      <!-- Screen Outline -->
      <rect x="130" y="160" width="140" height="90" rx="4" fill="#0F172A" stroke="#334155" stroke-width="3"/>
      <!-- Stand -->
      <line x1="200" y1="250" x2="200" y2="285" stroke="#475569" stroke-width="6"/>
      <rect x="175" y="285" width="50" height="8" rx="4" fill="#334155"/>
      <!-- Top Mounted Light Bar -->
      <rect x="110" y="145" width="180" height="12" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
      <!-- Light Beam onto desk only (Asymmetric projection) -->
      <polygon points="120,158 100,285 220,285 190,158" fill="#FEF08A" opacity="0.35"/>
      <!-- Wireless Knob Controller -->
      <circle cx="280" cy="275" r="14" fill="#334155" stroke="#64748B" stroke-width="2"/>
      <circle cx="280" cy="275" r="5" fill="#F97316"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Mijia Monitor Bar (Ra95)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F97316" text-anchor="end">699.000 ₫</text>
</svg>
