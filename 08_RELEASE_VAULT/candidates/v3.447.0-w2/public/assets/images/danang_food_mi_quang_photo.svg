<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="table-bg-co" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="table-light-co" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="ceramic-bowl-glaze-co" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#9a3412"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="golden-broth-co" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="scene-shadow-co" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Full-bleed Ambient Restaurant Table Background -->
  <rect width="1200" height="675" fill="url(#table-bg-co)"/>
  <rect width="1200" height="675" fill="url(#table-light-co)"/>
  
  <!-- Banana Leaf Table Runner & Bamboo Chopsticks -->
  <path d="M 0 520 Q 600 480 1200 540 L 1200 675 L 0 675 Z" fill="#14532d" opacity="0.35"/>
  <line x1="880" y1="200" x2="1080" y2="600" stroke="#d97706" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <line x1="905" y1="200" x2="1105" y2="600" stroke="#b45309" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  
  <!-- Large Gourmet Mì Quảng Ceramic Bowl -->
  <g transform="translate(600, 360)" filter="url(#scene-shadow-co)">
    <!-- Crispy Sesame Rice Cracker (Bánh tráng nướng mè giòn) -->
    <g transform="translate(-180, -90) rotate(-22)">
      <ellipse cx="0" cy="0" rx="140" ry="85" fill="#d97706" stroke="#b45309" stroke-width="3"/>
      <circle cx="-60" cy="-20" r="4" fill="#292524"/>
      <circle cx="-30" cy="10" r="5" fill="#292524"/>
      <circle cx="20" cy="-30" r="4" fill="#292524"/>
      <circle cx="50" cy="20" r="5" fill="#292524"/>
      <circle cx="-10" cy="-10" r="4" fill="#292524"/>
      <circle cx="80" cy="-10" r="4" fill="#292524"/>
    </g>
    
    <!-- Bowl Exterior Base -->
    <path d="M -270 -40 C -270 240 270 240 270 -40 Z" fill="url(#ceramic-bowl-glaze-co)"/>
    <!-- Bowl Ceramic Rim -->
    <ellipse cx="0" cy="-40" rx="270" ry="50" fill="#c2410c"/>
    <ellipse cx="0" cy="-40" rx="248" ry="40" fill="#fef3c7"/>
    
    <!-- Golden Turmeric Broth & Flat Rice Noodles -->
    <ellipse cx="0" cy="-38" rx="230" ry="32" fill="url(#golden-broth-co)"/>
    <path d="M -180 -45 Q 0 -115 180 -45" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M -150 -35 Q 20 -95 160 -35" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M -160 -25 Q -30 -80 140 -25" stroke="#d97706" stroke-width="11" stroke-linecap="round" fill="none"/>
    
    <!-- Fresh Juicy River Shrimp (Tôm sông rim đậm đà) -->
    <g transform="translate(-75, -70) rotate(-15)">
      <ellipse cx="0" cy="0" rx="42" ry="24" fill="#f43f5e"/>
      <path d="M 22 -12 Q 48 0 35 20" stroke="#be123c" stroke-width="6" fill="none"/>
      <circle cx="10" cy="-4" r="5" fill="#fda4af"/>
    </g>
    <g transform="translate(65, -75) rotate(20)">
      <ellipse cx="0" cy="0" rx="40" ry="22" fill="#f43f5e"/>
      <path d="M 20 -10 Q 44 0 32 18" stroke="#be123c" stroke-width="6" fill="none"/>
      <circle cx="8" cy="-4" r="5" fill="#fda4af"/>
    </g>
    
    <!-- Braised Pork Belly (Thịt ba chỉ rim) -->
    <rect x="-25" y="-95" width="50" height="28" rx="6" fill="#9a3412" transform="rotate(8 -25 -95)"/>
    <line x1="-20" y1="-85" x2="20" y2="-85" stroke="#fcd34d" stroke-width="4"/>
    
    <!-- Fresh Herbs & Greens (Rau sống: Húng lủi, bắp chuối, cải non) -->
    <circle cx="-15" cy="-55" r="28" fill="#15803d"/>
    <circle cx="120" cy="-50" r="24" fill="#16a34a"/>
    <circle cx="-125" cy="-45" r="26" fill="#15803d"/>
    
    <!-- Crushed Roasted Peanuts (Đậu phộng rang thơm) -->
    <circle cx="-35" cy="-78" r="7" fill="#78350f"/>
    <circle cx="25" cy="-72" r="8" fill="#78350f"/>
    <circle cx="85" cy="-60" r="7" fill="#78350f"/>
    <circle cx="-5" cy="-68" r="6" fill="#78350f"/>
    <circle cx="-65" cy="-62" r="6" fill="#78350f"/>
  </g>
  
  <!-- Subtle Editorial Scene Tag (Pure XML) -->
  <g transform="translate(48, 48)">
    <rect width="400" height="38" rx="19" fill="#0f172a" fill-opacity="0.8" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="200" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1">&#127836; M&#204; QU&#7842;NG HU&#7922;NH TH&#218;C KH&#193;NG &#8226; &#272;&#192; N&#7864;NG</text>
  </g>
</svg>