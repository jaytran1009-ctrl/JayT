<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="city-sky-co" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="90%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="bus-green-co" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="bus-shadow-co" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#064e3b" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- City Sky & Distant High-Rise Skyline -->
  <rect width="1200" height="675" fill="url(#city-sky-co)"/>
  
  <!-- Distant Skyline Silhouettes -->
  <g opacity="0.4">
    <rect x="80" y="240" width="80" height="180" fill="#0369a1"/>
    <rect x="180" y="190" width="110" height="230" fill="#0284c7"/>
    <rect x="310" y="260" width="70" height="160" fill="#0369a1"/>
    <rect x="850" y="210" width="90" height="210" fill="#0284c7"/>
    <rect x="960" y="160" width="130" height="260" fill="#0369a1"/>
  </g>
  
  <!-- Asphalt Boulevard & Tree-Lined Greenery -->
  <rect x="0" y="420" width="1200" height="255" fill="#1e293b"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#facc15" stroke-width="8" stroke-dasharray="60, 40"/>
  
  <!-- Green Sheltered Bus Stop (Trạm chờ xe buýt Đà Nẵng) -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="220" height="15" rx="4" fill="#15803d"/>
    <line x1="20" y1="15" x2="20" y2="130" stroke="#475569" stroke-width="6"/>
    <line x1="200" y1="15" x2="200" y2="130" stroke="#475569" stroke-width="6"/>
    <rect x="35" y="25" width="150" height="85" rx="8" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1"/>
    <text x="110" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">DANABUS R16</text>
    <text x="110" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">S&#194;N BAY &#8596; B&#7870;N XE</text>
  </g>
  
  <!-- Modern Eco DanaBus -->
  <g transform="translate(380, 270)" filter="url(#bus-shadow-co)">
    <!-- Bus Body -->
    <rect x="0" y="0" width="680" height="230" rx="40" fill="url(#bus-green-co)"/>
    <!-- Windows -->
    <rect x="30" y="26" width="620" height="100" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <line x1="220" y1="26" x2="220" y2="126" stroke="#15803d" stroke-width="8"/>
    <line x1="420" y1="26" x2="420" y2="126" stroke="#15803d" stroke-width="8"/>
    <path d="M 580 26 L 650 26 C 650 26 650 126 600 126 L 580 126 Z" fill="#bae6fd"/>
    
    <!-- Route Sign -->
    <rect x="250" y="38" width="180" height="30" rx="8" fill="#0f172a"/>
    <text x="340" y="59" font-family="monospace" font-size="16" font-weight="bold" fill="#facc15" text-anchor="middle">R16 S&#194;N BAY &#272;&#192; N&#7864;NG</text>
    
    <!-- Eco Wave Decal -->
    <path d="M 0 170 Q 340 130 680 170 L 680 230 L 0 230 Z" fill="#14532d" opacity="0.35"/>
    
    <!-- Wheels -->
    <circle cx="150" cy="230" r="50" fill="#0f172a"/>
    <circle cx="150" cy="230" r="24" fill="#94a3b8"/>
    <circle cx="530" cy="230" r="50" fill="#0f172a"/>
    <circle cx="530" cy="230" r="24" fill="#94a3b8"/>
  </g>
  
  <!-- Editorial Tag -->
  <g transform="translate(48, 48)">
    <rect width="380" height="38" rx="19" fill="#0f172a" fill-opacity="0.8" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="190" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#86efac" text-anchor="middle" letter-spacing="1">&#128652; XE BU&#221;T XANH DANABUS &#8226; &#272;&#192; N&#7864;NG</text>
  </g>
</svg>