<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0284C7"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ANKER</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Cáp sạc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Anker Retractable Disc -->
      <circle cx="200" cy="200" r="45" fill="#0F172A" stroke="#0284C7" stroke-width="4"/>
      <circle cx="200" cy="200" r="22" fill="#1E293B"/>
      <text x="200" y="205" font-family="sans-serif" font-size="11" font-weight="900" fill="#38BDF8" text-anchor="middle">ANKER</text>
      <!-- Dual Pull Leads -->
      <path d="M155 200 L115 170" stroke="#64748B" stroke-width="6"/>
      <path d="M245 200 L285 170" stroke="#64748B" stroke-width="6"/>
      <!-- Triple Heads Clustered -->
      <rect x="285" y="160" width="18" height="20" rx="4" fill="#0284C7"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">PowerLine 3-in-1 Retractable</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="end">289.000 ₫</text>
</svg>
