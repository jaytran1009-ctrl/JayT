<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#10B981"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">UGREEN</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Cáp sạc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Ugreen Nexode Compact GaN Cube -->
      <rect x="155" y="145" width="90" height="90" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="4"/>
      <!-- US/VN Folding Prongs -->
      <rect x="175" y="235" width="10" height="25" rx="2" fill="#94A3B8"/>
      <rect x="215" y="235" width="10" height="25" rx="2" fill="#94A3B8"/>
      <!-- Type-C Port Hole -->
      <rect x="185" y="165" width="30" height="12" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <text x="200" y="210" font-family="sans-serif" font-size="13" font-weight="900" fill="#10B981" text-anchor="middle">30W GaN</text>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Nexode 30W GaN Fast Charger</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">239.000 ₫</text>
</svg>
