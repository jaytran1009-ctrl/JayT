<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg_n_food" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg_n_food)"/>
  
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.2"/>
    <text x="80" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ẨM THỰC SINH VIÊN</text>
  </g>
  <g transform="translate(430, 40)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#000000" fill-opacity="0.45"/>
    <text x="80" y="17" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HÌNH MINH HỌA CHUẨN</text>
  </g>

  <!-- Cloche / Food Plate Vector Icon -->
  <g transform="translate(320, 200) scale(1.3)">
    <path d="M-50 20 L50 20 L55 26 L-55 26 Z" fill="#34D399"/>
    <path d="M-40 18 Q0 -40 40 18 Z" fill="#A7F3D0" stroke="#047857" stroke-width="2"/>
    <circle cx="0" cy="-32" r="7" fill="#34D399"/>
  </g>

  <g transform="translate(50, 315)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Ưu Đãi Món Ăn Sinh Viên Đà Nẵng</text>
    <text x="0" y="30" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Được thẩm định & đối soát thực tế tại cơ sở</text>
  </g>
  <rect x="0" y="394" width="640" height="6" fill="#34D399"/>
</svg>