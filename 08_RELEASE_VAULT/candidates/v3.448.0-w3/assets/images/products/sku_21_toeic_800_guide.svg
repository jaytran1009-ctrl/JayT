<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#EA580C"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ALPHA BOOKS</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Giáo trình ôn thi</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- TOEIC 800+ Book Cover -->
      <rect x="140" y="125" width="120" height="160" rx="6" fill="#EA580C" stroke="#C2410C" stroke-width="3"/>
      <!-- Spine -->
      <rect x="140" y="125" width="16" height="160" rx="3" fill="#9A3412"/>
      <!-- Badge 800+ -->
      <circle cx="200" cy="180" r="26" fill="#FEF3C7"/>
      <text x="200" y="186" font-family="sans-serif" font-size="14" font-weight="900" fill="#EA580C" text-anchor="middle">800+</text>
      <!-- Title text lines -->
      <rect x="165" y="145" width="70" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="165" y="225" width="75" height="5" rx="2.5" fill="#FED7AA"/>
      <rect x="165" y="235" width="55" height="5" rx="2.5" fill="#FED7AA"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">TOEIC 800+ (2026 Edition)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EA580C" text-anchor="end">112.000 ₫</text>
</svg>
