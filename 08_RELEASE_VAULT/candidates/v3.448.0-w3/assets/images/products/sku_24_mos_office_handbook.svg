<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0D9488"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">NXB DÂN TRÍ</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Giáo trình ôn thi</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- MOS Excel & Word Manual -->
      <rect x="140" y="125" width="120" height="160" rx="6" fill="#0F766E" stroke="#115E59" stroke-width="3"/>
      <rect x="140" y="125" width="16" height="160" rx="3" fill="#134E4A"/>
      <!-- Excel Green Tile & Word Blue Tile -->
      <rect x="168" y="155" width="30" height="30" rx="4" fill="#16A34A"/>
      <text x="183" y="176" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">X</text>
      <rect x="204" y="155" width="30" height="30" rx="4" fill="#2563EB"/>
      <text x="219" y="176" font-family="sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">W</text>
      <rect x="168" y="205" width="70" height="6" rx="3" fill="#99F6E4"/>
      <rect x="168" y="218" width="50" height="6" rx="3" fill="#99F6E4"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">MOS Excel & Word 2026</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0D9488" text-anchor="end">125.000 ₫</text>
</svg>
