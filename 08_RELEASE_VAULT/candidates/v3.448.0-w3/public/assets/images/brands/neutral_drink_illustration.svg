<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg_n_drink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg_n_drink)"/>
  
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.2"/>
    <text x="80" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TRÀ &amp; CÀ PHÊ</text>
  </g>
  <g transform="translate(430, 40)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#000000" fill-opacity="0.45"/>
    <text x="80" y="17" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HÌNH MINH HỌA CHUẨN</text>
  </g>

  <!-- Drink Glass Vector Icon -->
  <g transform="translate(320, 200) scale(1.3)">
    <polygon points="-30,-40 30,-40 22,45 -22,45" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <line x1="8" y1="-55" x2="-8" y2="40" stroke="#F59E0B" stroke-width="4"/>
  </g>

  <g transform="translate(50, 315)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Ưu Đãi Trà &amp; Cà Phê Học Nhóm</text>
    <text x="0" y="30" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Được thẩm định &amp; đối soát thực tế tại cơ sở</text>
  </g>
  <rect x="0" y="394" width="640" height="6" fill="#38BDF8"/>
</svg>