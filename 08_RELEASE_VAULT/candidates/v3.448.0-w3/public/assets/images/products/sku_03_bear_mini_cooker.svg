<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#F59E0B"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BEAR</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Ấm siêu tốc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Bear Mini Cooker Pot -->
      <rect x="140" y="190" width="120" height="90" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="4"/>
      <!-- Long Pan Handle -->
      <rect x="250" y="215" width="80" height="18" rx="8" fill="#78350F"/>
      <!-- Steamer insert -->
      <rect x="145" y="155" width="110" height="35" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
      <!-- Glass Lid with Bear Ears -->
      <path d="M150 155 Q200 130 250 155" fill="none" stroke="#D97706" stroke-width="3"/>
      <circle cx="200" cy="135" r="8" fill="#F59E0B"/>
      <!-- Steaming Vents -->
      <circle cx="175" cy="172" r="3" fill="#94A3B8"/>
      <circle cx="200" cy="172" r="3" fill="#94A3B8"/>
      <circle cx="225" cy="172" r="3" fill="#94A3B8"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">DRG-C12K1 (1.5L)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F59E0B" text-anchor="end">249.000 ₫</text>
</svg>
