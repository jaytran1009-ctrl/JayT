<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#059669"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">NXB TRẺ</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Giáo trình ôn thi</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Finance Guide Book -->
      <rect x="140" y="125" width="120" height="160" rx="6" fill="#059669" stroke="#047857" stroke-width="3"/>
      <rect x="140" y="125" width="16" height="160" rx="3" fill="#064E3B"/>
      <!-- Piggy Bank / Coin Icon -->
      <circle cx="200" cy="175" r="24" fill="#FDE047"/>
      <text x="200" y="182" font-family="sans-serif" font-size="20" font-weight="900" fill="#854D0E" text-anchor="middle">₫</text>
      <rect x="165" y="215" width="75" height="5" rx="2.5" fill="#A7F3D0"/>
      <rect x="165" y="226" width="60" height="5" rx="2.5" fill="#A7F3D0"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Tài Chính Sinh Viên (Tái Bản)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#059669" text-anchor="end">85.000 ₫</text>
</svg>
