<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
      <defs>
        <linearGradient id="bg-bus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0fdf4"/>
          <stop offset="50%" stop-color="#dcfce7"/>
          <stop offset="100%" stop-color="#bbf7d0"/>
        </linearGradient>
      </defs>
      <rect width="800" height="450" fill="url(#bg-bus-grad)"/>
      <!-- Bus Illustration -->
      <rect x="220" y="140" width="360" height="180" rx="28" fill="#15803d"/>
      <rect x="240" y="160" width="320" height="80" rx="14" fill="#e0f2fe"/>
      <!-- Windows & Divider -->
      <line x1="340" y1="160" x2="340" y2="240" stroke="#15803d" stroke-width="6"/>
      <line x1="440" y1="160" x2="440" y2="240" stroke="#15803d" stroke-width="6"/>
      <!-- Wheels -->
      <circle cx="310" cy="320" r="32" fill="#1e293b"/>
      <circle cx="310" cy="320" r="14" fill="#94a3b8"/>
      <circle cx="490" cy="320" r="32" fill="#1e293b"/>
      <circle cx="490" cy="320" r="14" fill="#94a3b8"/>
      <!-- Headlights -->
      <rect x="560" y="270" width="20" height="24" rx="6" fill="#fef08a"/>
      <!-- Text Badge -->
      <rect x="180" y="40" width="440" height="46" rx="23" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(15,23,42,0.08))"/>
      <text x="400" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">🚌 DANABUS &#8226; XE BUÝT ĐÔ THỊ TRỢ GIÁ ĐÀ NẴNG</text>
      <!-- Route Hint -->
      <text x="400" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Tuyến R16: Sân Bay &#8596; Bến Xe Trung Tâm &#8226; Tuyến R04: Cầu Rồng &#8596; Mỹ Khê</text>
    </svg>