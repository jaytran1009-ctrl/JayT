<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#3B82F6"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">RAPOO</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Chuột không dây</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Rapoo M10 Plus Streamline -->
      <path d="M155 220 C155 150 170 125 200 125 C230 125 245 150 245 220 C245 270 230 290 200 290 C170 290 155 270 155 220 Z" fill="#1E293B" stroke="#3B82F6" stroke-width="4"/>
      <line x1="200" y1="125" x2="200" y2="180" stroke="#3B82F6" stroke-width="2"/>
      <rect x="195" y="145" width="10" height="22" rx="5" fill="#3B82F6"/>
      <ellipse cx="200" cy="245" rx="12" ry="6" fill="#334155"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">M10 Plus (1000 DPI)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#3B82F6" text-anchor="end">149.000 ₫</text>
</svg>
