<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#6366F1"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">KLONG</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Giáo trình ôn thi</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Stack of KLong Notebooks -->
      <rect x="135" y="150" width="120" height="140" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="3"/>
      <rect x="145" y="140" width="120" height="140" rx="6" fill="#C7D2FE" stroke="#6366F1" stroke-width="3"/>
      <rect x="155" y="130" width="120" height="140" rx="6" fill="#818CF8" stroke="#4F46E5" stroke-width="3"/>
      <!-- Spiral Wire Binding -->
      <line x1="155" y1="140" x2="155" y2="265" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="3 5"/>
      <!-- Cover Minimal Graphic -->
      <rect x="180" y="160" width="70" height="35" rx="4" fill="#FFFFFF" opacity="0.85"/>
      <text x="215" y="182" font-family="sans-serif" font-size="12" font-weight="900" fill="#4F46E5" text-anchor="middle">KLONG B5</text>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Combo 5 Vở B5 120 Trang</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#6366F1" text-anchor="end">95.000 ₫</text>
</svg>
