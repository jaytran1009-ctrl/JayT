<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#1E40AF"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PHILIPS</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Ấm siêu tốc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Philips Inox Cone Kettle -->
      <path d="M145 280 L165 160 L235 160 L255 280 Z" fill="#CBD5E1" stroke="#64748B" stroke-width="4"/>
      <path d="M140 280 L260 280 L255 295 L145 295 Z" fill="#0F172A"/>
      <!-- Handle -->
      <path d="M235 160 Q290 195 250 265" fill="none" stroke="#0F172A" stroke-width="15" stroke-linecap="round"/>
      <!-- Philips Blue Accent on Base -->
      <line x1="150" y1="275" x2="250" y2="275" stroke="#1D4ED8" stroke-width="3"/>
      <!-- Spout with Filter -->
      <path d="M165 170 L130 155 L140 190 Z" fill="#94A3B8"/>
      <!-- Metal Polish Reflection -->
      <path d="M180 160 L195 280" stroke="#FFFFFF" stroke-width="10" opacity="0.5"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">HD9306 (1.5L Inox 304)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#1E40AF" text-anchor="end">429.000 ₫</text>
</svg>
