<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#DC2626"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SUNHOUSE</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Ấm siêu tốc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Sunhouse Stainless Steel Kettle -->
      <path d="M140 280 L160 160 Q160 140 180 140 L220 140 Q240 140 240 160 L260 280 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4"/>
      <path d="M150 280 L250 280 L255 295 L145 295 Z" fill="#1E293B"/>
      <!-- Spout -->
      <path d="M160 170 L120 150 L130 180 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="3"/>
      <!-- Handle -->
      <path d="M235 155 Q290 190 255 260" fill="none" stroke="#1E293B" stroke-width="16" stroke-linecap="round"/>
      <!-- Lid & Knob -->
      <ellipse cx="200" cy="140" rx="30" ry="8" fill="#1E293B"/>
      <circle cx="200" cy="130" r="7" fill="#DC2626"/>
      <!-- Stainless Reflection -->
      <path d="M185 160 L195 280" stroke="#FFFFFF" stroke-width="8" opacity="0.6"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">SHD1182 (1.8L)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="end">139.000 ₫</text>
</svg>
