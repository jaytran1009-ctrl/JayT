<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#EA580C"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GAABOR</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Ấm siêu tốc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Modern Matte White Kettle -->
      <path d="M150 280 L160 160 L240 160 L250 280 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
      <rect x="145" y="278" width="110" height="15" rx="4" fill="#334155"/>
      <!-- Minimalist Wood Finish Handle -->
      <path d="M240 165 Q285 200 245 265" fill="none" stroke="#B45309" stroke-width="14" stroke-linecap="round"/>
      <!-- Spout -->
      <path d="M160 170 L130 155 L140 185 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
      <!-- Flat Lid -->
      <ellipse cx="200" cy="160" rx="38" ry="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="195" y="148" width="10" height="10" rx="2" fill="#B45309"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">EK20M-WH01A (1.8L)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#EA580C" text-anchor="end">169.000 ₫</text>
</svg>
