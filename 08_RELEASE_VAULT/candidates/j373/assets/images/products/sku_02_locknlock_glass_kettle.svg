<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0284C7"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">LOCK&LOCK</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Ấm siêu tốc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Glass Kettle with Blue LED Ring -->
      <rect x="155" y="150" width="90" height="130" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="4" opacity="0.8"/>
      <rect x="150" y="275" width="100" height="18" rx="4" fill="#0F172A"/>
      <!-- Blue LED Glow Ring -->
      <ellipse cx="200" cy="272" rx="42" ry="6" fill="#38BDF8" opacity="0.9"/>
      <!-- Water level indicator -->
      <line x1="170" y1="180" x2="170" y2="250" stroke="#0284C7" stroke-width="3" stroke-dasharray="2 6"/>
      <!-- Spout -->
      <path d="M155 165 L120 145 L135 180 Z" fill="#94A3B8"/>
      <!-- Handle -->
      <path d="M245 160 Q295 200 245 265" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
      <!-- Lid -->
      <path d="M165 150 L235 150 L230 135 L170 135 Z" fill="#94A3B8"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">EJK418SLV (1.8L)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="end">389.000 ₫</text>
</svg>
