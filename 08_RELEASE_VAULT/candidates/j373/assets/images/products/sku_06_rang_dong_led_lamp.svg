<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#16A34A"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">RẠNG ĐÔNG</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Đèn bàn</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Rang Dong Table Lamp -->
      <ellipse cx="180" cy="285" rx="45" ry="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
      <!-- Gooseneck Stem -->
      <path d="M180 275 Q160 200 210 170 Q250 150 250 140" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
      <!-- Lamp Head with LED Light Beam -->
      <rect x="220" y="125" width="70" height="22" rx="10" fill="#16A34A"/>
      <path d="M230 148 L200 240 L310 240 L280 148 Z" fill="#FEF08A" opacity="0.25"/>
      <circle cx="180" cy="280" r="5" fill="#16A34A"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">RD-RL-24 (LED Chống Cận)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#16A34A" text-anchor="end">185.000 ₫</text>
</svg>
