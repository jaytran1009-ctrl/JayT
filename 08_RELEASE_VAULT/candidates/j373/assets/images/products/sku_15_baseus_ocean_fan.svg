<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0284C7"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BASEUS</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Quạt kẹp KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Baseus Ocean Fan with Clip -->
      <path d="M160 285 L240 285 L230 265 L170 265 Z" fill="#0284C7"/>
      <path d="M200 265 L200 220" stroke="#0369A1" stroke-width="10" stroke-linecap="round"/>
      <circle cx="200" cy="160" r="54" fill="#F0F9FF" stroke="#0284C7" stroke-width="4"/>
      <!-- 4 Curved Ocean Wave Blades -->
      <circle cx="200" cy="160" r="14" fill="#0284C7"/>
      <path d="M200 160 Q215 120 235 125 Q210 145 200 160" fill="#38BDF8"/>
      <path d="M200 160 Q240 175 235 195 Q215 170 200 160" fill="#38BDF8"/>
      <path d="M200 160 Q185 200 165 195 Q190 175 200 160" fill="#38BDF8"/>
      <path d="M200 160 Q160 145 165 125 Q185 150 200 160" fill="#38BDF8"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Ocean Fan (USB Silent)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0284C7" text-anchor="end">235.000 ₫</text>
</svg>
