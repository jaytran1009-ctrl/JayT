<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
      <defs>
        <linearGradient id="sand-sky-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc"/>
          <stop offset="50%" stop-color="#e2e8f0"/>
          <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>
        <linearGradient id="museum-roof" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0369a1"/>
          <stop offset="50%" stop-color="#0284c7"/>
          <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
        <filter id="cham-shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0c4a6e" flood-opacity="0.15"/>
        </filter>
      </defs>
      
      <!-- Sky Background -->
      <rect width="960" height="540" fill="url(#sand-sky-bg)"/>
      
      <circle cx="480" cy="270" r="220" fill="#38bdf8" opacity="0.1"/>
      <circle cx="820" cy="140" r="140" fill="#0284c7" opacity="0.08"/>
      
      <!-- Top Badge -->
      <g transform="translate(260, 36)" filter="url(#cham-shadow)">
        <rect width="440" height="48" rx="24" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
        <text x="220" y="30" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1">🏛️ DI SẢN VĂN HÓA &#8226; BẢO TÀNG CHĂM ĐÀ NẴNG</text>
      </g>
      
      <!-- Iconic French-Cham Architecture Facade -->
      <g transform="translate(240, 150)" filter="url(#cham-shadow)">
        <!-- Roof Structure -->
        <path d="M 0 160 L 0 80 L 240 0 L 480 80 L 480 160 Z" fill="url(#museum-roof)"/>
        <!-- Main Hall Wall -->
        <rect x="20" y="140" width="440" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
        <!-- Windows & Heritage Archways -->
        <rect x="50" y="170" width="60" height="90" rx="30" fill="#bae6fd"/>
        <rect x="150" y="170" width="60" height="90" rx="30" fill="#bae6fd"/>
        <rect x="270" y="170" width="60" height="90" rx="30" fill="#bae6fd"/>
        <rect x="370" y="170" width="60" height="90" rx="30" fill="#bae6fd"/>
        <!-- Main Grand Entrance -->
        <rect x="210" y="160" width="60" height="130" rx="30" fill="#0284c7"/>
        <!-- Heritage Columns -->
        <line x1="130" y1="140" x2="130" y2="290" stroke="#0369a1" stroke-width="8"/>
        <line x1="350" y1="140" x2="350" y2="290" stroke="#0369a1" stroke-width="8"/>
      </g>
      
      <!-- Bottom Narrative -->
      <text x="480" y="495" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
        Lưu giữ hơn 400 bảo vật sa thạch vô giá &#8226; Số 02 Đường 2 Tháng 9, Hải Châu
      </text>
    </svg>