<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#F59E0B"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">JOHNDARR</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-fan-metal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#64748B"/>
          <stop offset="50%" stop-color="#334155"/>
          <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <radialGradient id="g-glow-18" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(245, 158, 11, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-18)"/>
      <ellipse cx="200" cy="315" rx="75" ry="12" fill="rgba(10,17,13,0.85)"/>
      <!-- Turbofan Cylindrical Air Nozzle Top -->
      <circle cx="200" cy="130" r="38" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
      <!-- High-Speed Turbine Impeller Blades -->
      <circle cx="200" cy="130" r="8" fill="#F59E0B"/>
      <path d="M200 130 L180 105 Q195 100 200 130" fill="#94A3B8"/>
      <path d="M200 130 L225 110 Q230 125 200 130" fill="#94A3B8"/>
      <path d="M200 130 L220 155 Q205 160 200 130" fill="#94A3B8"/>
      <path d="M200 130 L175 150 Q170 135 200 130" fill="#94A3B8"/>
      <!-- Jet Wind Stream Ring -->
      <circle cx="200" cy="130" r="30" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- Sleek Handle Stem -->
      <rect x="185" y="165" width="30" height="115" rx="14" fill="url(#g-fan-metal)" stroke="#475569" stroke-width="2"/>
      <!-- Digital LED Speed Indicator -->
      <rect x="190" y="180" width="20" height="12" rx="3" fill="#000000" stroke="#F59E0B" stroke-width="1"/>
      <text x="200" y="189" font-family="monospace" font-size="7.5" font-weight="900" fill="#F59E0B" text-anchor="middle">100</text>
      <!-- Power / Step Slider Button -->
      <rect x="193" y="205" width="14" height="24" rx="7" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="200" cy="214" r="4" fill="#EF4444"/>
      <text x="200" y="255" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#CBD5E1" text-anchor="middle">TURBO JET</text>
      <text x="200" y="265" font-family="-apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#F59E0B" text-anchor="middle">JF157</text>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Quạt Tuabin Cầm Tay JF157</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">149.000 ₫</text>
</svg>
