<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#059669"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MỘC AN</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-mocan-green" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#059669"/>
          <stop offset="50%" stop-color="#047857"/>
          <stop offset="100%" stop-color="#064E3B"/>
        </linearGradient>
        <radialGradient id="g-glow-17" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(5, 150, 105, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-17)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Top Hanging Hook Ring -->
      <path d="M192 105 Q200 85 208 105" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
      <!-- Main Hanging Pack Body -->
      <rect x="145" y="105" width="110" height="165" rx="12" fill="url(#g-mocan-green)" stroke="#065F46" stroke-width="2.5"/>
      <!-- Center Gold Leaf Motif & Label -->
      <circle cx="200" cy="155" r="24" fill="rgba(255,255,255,0.15)" stroke="#FDE68A" stroke-width="1.5"/>
      <text x="200" y="162" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">🌿</text>
      <text x="200" y="195" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MỘC AN</text>
      <text x="200" y="210" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#A7F3D0" text-anchor="middle">TOPGIA CHÍNH HÃNG</text>
      <text x="200" y="222" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#ECFDF5" text-anchor="middle">1000 TỜ · 4 LỚP BỘT GỖ</text>
      <text x="200" y="234" font-family="-apple-system, sans-serif" font-size="7" font-weight="600" fill="#FDE68A" text-anchor="middle">TẶNG 3 MÓC TREO TƯỜNG</text>
      <!-- Bottom Tissue Pull -->
      <path d="M165 265 L235 265 L220 295 L180 295 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <path d="M152 115 L152 260" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Khăn Giấy Mộc An (1000 Tờ 4 Lớp)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">32.000 ₫</text>
</svg>
