<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0284C7"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PIO TOPGIA</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-pio-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38BDF8"/>
          <stop offset="50%" stop-color="#0284C7"/>
          <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <radialGradient id="g-glow-13" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(2, 132, 199, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-13)"/>
      <ellipse cx="200" cy="315" rx="85" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Pio Pouch Rectangular Body -->
      <rect x="145" y="125" width="110" height="145" rx="14" fill="url(#g-pio-cyan)" stroke="#075985" stroke-width="2.5"/>
      <!-- Top Perforated Pull Center with emerged tissue -->
      <ellipse cx="200" cy="128" rx="28" ry="6" fill="#0C4A6E"/>
      <path d="M185 125 C190 95 200 90 205 105 C210 90 220 95 225 125 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Front Badge -->
      <rect x="156" y="160" width="88" height="60" rx="8" fill="#FFFFFF" opacity="0.95"/>
      <text x="200" y="180" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#0369A1" text-anchor="middle" letter-spacing="1">PIO</text>
      <text x="200" y="195" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#047857" text-anchor="middle">BY TOPGIA HCM</text>
      <text x="200" y="208" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#64748B" text-anchor="middle">200 LẦN RÚT · SIÊU DAI</text>
      <!-- Side Specular Reflection -->
      <path d="M152 135 L152 255" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Khăn Giấy Pio (200 Lần Rút)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">42.000 ₫</text>
</svg>
