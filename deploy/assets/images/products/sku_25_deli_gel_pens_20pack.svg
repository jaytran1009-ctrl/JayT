<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="rgba(229,195,120,0.12)"/>
  
  <!-- Top Brand &amp; Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#D97706"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DELI</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Giáo trình ôn thi</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Deli Gel Pens Box -->
      <rect x="150" y="140" width="100" height="145" rx="8" fill="#F8FAFC" stroke="#D97706" stroke-width="3"/>
      <!-- Clear Window Showing Pens -->
      <rect x="160" y="150" width="80" height="85" rx="4" fill="#E2E8F0"/>
      <!-- 4 Pen Caps Visible -->
      <rect x="168" y="155" width="8" height="75" rx="3" fill="#1E293B"/>
      <rect x="184" y="155" width="8" height="75" rx="3" fill="#1E293B"/>
      <rect x="200" y="155" width="8" height="75" rx="3" fill="#1E293B"/>
      <rect x="216" y="155" width="8" height="75" rx="3" fill="#1E293B"/>
      <rect x="160" y="245" width="80" height="25" rx="4" fill="#D97706"/>
      <text x="200" y="262" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">DELI 20 PCS</text>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Gel Pen 0.5mm (Hộp 20 Cây)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="end">59.000 ₫</text>
</svg>
