<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg_dorm_ph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" rx="16" fill="url(#bg_dorm_ph)"/>
  <rect x="1" y="1" width="398" height="398" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Badges -->
  <g transform="translate(20, 24)">
    <rect x="0" y="0" width="175" height="26" rx="13" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
    <text x="87" y="17" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📦 VẬT DỤNG KTX CHÍNH HÃNG</text>
  </g>
  <g transform="translate(215, 24)">
    <rect x="0" y="0" width="165" height="26" rx="6" fill="#000000" fill-opacity="0.4" stroke="#475569" stroke-width="1"/>
    <text x="82" y="17" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">ĐANG CHỜ ẢNH GỐC MALL</text>
  </g>

  <!-- Center Product Box Graphic -->
  <g transform="translate(200, 180)">
    <!-- Isometric Cube / Box -->
    <path d="M0 -50 L60 -20 L0 10 L-60 -20 Z" fill="#60A5FA" fill-opacity="0.9"/>
    <path d="M-60 -20 L0 10 L0 75 L-60 45 Z" fill="#2563EB"/>
    <path d="M0 10 L60 -20 L60 45 L0 75 Z" fill="#1D4ED8"/>
    <!-- Box Tape -->
    <path d="M-10 -35 L10 -25 L10 60 L-10 50 Z" fill="#F59E0B" fill-opacity="0.85"/>
    <!-- Checkmark Badge -->
    <circle cx="45" cy="35" r="18" fill="#10B981" stroke="#0F172A" stroke-width="3"/>
    <path d="M38 35 L43 40 L52 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Descriptive Bottom Text -->
  <g transform="translate(200, 310)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Hình Ảnh Sản Phẩm Đang Cập Nhật</text>
    <text x="0" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle">Chuẩn xác thực Mall • Minh bạch không giả lập ảnh</text>
    <text x="0" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic" text-anchor="middle">JayT Campus Commerce • M0 Single Source</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="394" width="400" height="6" rx="3" fill="#10B981"/>
</svg>