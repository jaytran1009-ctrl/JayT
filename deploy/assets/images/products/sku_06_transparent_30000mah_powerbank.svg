<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#06B6D4"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CYBER MECA</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Học tập & Công nghệ</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-cyber-chip" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <radialGradient id="g-glow-6" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(6, 182, 212, 0.35)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="120" ry="90" fill="url(#g-glow-6)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Transparent Outer Housing -->
      <rect x="145" y="100" width="110" height="185" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#06B6D4" stroke-width="2.5"/>
      <!-- Internal PCB Circuit Board -->
      <rect x="152" y="108" width="96" height="168" rx="10" fill="url(#g-cyber-chip)"/>
      <!-- Circuit Traces Gold & Cyan -->
      <path d="M160 140 L180 140 L180 170 L200 170" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      <path d="M240 140 L220 140 L220 170 L200 170" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
      <circle cx="180" cy="170" r="3" fill="#F59E0B"/>
      <circle cx="220" cy="170" r="3" fill="#06B6D4"/>
      <!-- Two Battery Cell Outlines Visible Behind -->
      <rect x="156" y="180" width="40" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <rect x="204" y="180" width="40" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="176" y="225" font-family="monospace" font-size="7" fill="#64748B" text-anchor="middle">CELL 1</text>
      <text x="224" y="225" font-family="monospace" font-size="7" fill="#64748B" text-anchor="middle">CELL 2</text>
      <!-- Circular Digital LED Gauge Display -->
      <circle cx="200" cy="135" r="18" fill="#000000" stroke="#22D3EE" stroke-width="2"/>
      <text x="200" y="139" font-family="monospace" font-size="10" font-weight="900" fill="#22D3EE" text-anchor="middle">100%</text>
      <text x="200" y="147" font-family="-apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#34D399" text-anchor="middle">⚡ FAST PD</text>
      <!-- Dual Output Ports Top -->
      <rect x="160" y="94" width="22" height="8" rx="2" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
      <rect x="190" y="94" width="20" height="8" rx="2" fill="#0284C7" stroke="#94A3B8" stroke-width="1"/>
      <rect x="218" y="94" width="22" height="8" rx="2" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
      <!-- Glass Specular Reflection Line -->
      <path d="M150 110 L150 275" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Sạc Trong Suốt 30000mAh (LED 22.5W)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">189.000 ₫</text>
</svg>
