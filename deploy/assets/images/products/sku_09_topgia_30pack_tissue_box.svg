<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#059669"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TOPGIA</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-box-kraft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#D97706"/>
          <stop offset="50%" stop-color="#B45309"/>
          <stop offset="100%" stop-color="#92400E"/>
        </linearGradient>
        <radialGradient id="g-glow-9" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(16, 185, 129, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="120" ry="90" fill="url(#g-glow-9)"/>
      <ellipse cx="200" cy="315" rx="90" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- 3D Isometric Kraft Delivery Box -->
      <polygon points="135,160 200,130 265,160 200,190" fill="#FBBF24" stroke="#B45309" stroke-width="1.5"/>
      <polygon points="135,160 200,190 200,285 135,255" fill="url(#g-box-kraft)" stroke="#78350F" stroke-width="2"/>
      <polygon points="265,160 200,190 200,285 265,255" fill="#92400E" stroke="#78350F" stroke-width="2"/>
      <!-- Stacks of Pastel Tissue Packs inside open box -->
      <rect x="165" y="125" width="32" height="18" rx="3" fill="#F472B6" stroke="#DB2777" stroke-width="1"/>
      <rect x="202" y="125" width="32" height="18" rx="3" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
      <rect x="183" y="112" width="34" height="16" rx="3" fill="#34D399" stroke="#059669" stroke-width="1"/>
      <!-- Prominent Brand Label on Front Box Flap -->
      <rect x="145" y="200" width="48" height="42" rx="4" fill="#FFFFFF" opacity="0.95"/>
      <text x="169" y="215" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" fill="#047857" text-anchor="middle">TOPGIA</text>
      <text x="169" y="226" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="800" fill="#B45309" text-anchor="middle">THÙNG 30 GÓI</text>
      <text x="169" y="236" font-family="-apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#64748B" text-anchor="middle">4 LỚP CAO CẤP</text>
      <!-- Parcel Tape strip -->
      <line x1="200" y1="190" x2="200" y2="285" stroke="#FDE68A" stroke-width="3" stroke-dasharray="4,2"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Thùng 30 Gói Giấy Ăn Rút (4 Lớp)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">119.000 ₫</text>
</svg>
