<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#6366F1"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">FINELIFE</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Cá nhân & Di chuyển</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-inflator-body" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="50%" stop-color="#1E293B"/>
          <stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <radialGradient id="g-glow-8" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-8)"/>
      <ellipse cx="200" cy="315" rx="75" ry="12" fill="rgba(10,17,13,0.85)"/>
      <!-- Top Air Hose Loop -->
      <path d="M200 95 C180 65 150 75 160 105" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
      <rect x="195" y="90" width="10" height="12" rx="2" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
      <!-- Handheld Pump Cylinder Body -->
      <rect x="155" y="100" width="90" height="185" rx="18" fill="url(#g-inflator-body)" stroke="#64748B" stroke-width="2"/>
      <!-- Circular Digital Pressure Screen -->
      <circle cx="200" cy="150" r="26" fill="#000000" stroke="#818CF8" stroke-width="2"/>
      <text x="200" y="152" font-family="monospace" font-size="13" font-weight="900" fill="#38BDF8" text-anchor="middle">2.40</text>
      <text x="200" y="164" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#94A3B8" text-anchor="middle">BAR / 35 PSI</text>
      <!-- Tactile Navigation D-pad Controls -->
      <circle cx="200" cy="215" r="22" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <circle cx="200" cy="215" r="9" fill="#EF4444"/>
      <text x="200" y="218" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">⚡</text>
      <!-- +/- symbols -->
      <text x="200" y="202" font-family="sans-serif" font-size="9" font-weight="900" fill="#CBD5E1" text-anchor="middle">+</text>
      <text x="200" y="233" font-family="sans-serif" font-size="9" font-weight="900" fill="#CBD5E1" text-anchor="middle">-</text>
      <!-- Cooling Grill Slots -->
      <line x1="168" y1="255" x2="185" y2="255" stroke="#475569" stroke-width="2"/>
      <line x1="168" y1="262" x2="185" y2="262" stroke="#475569" stroke-width="2"/>
      <line x1="215" y1="255" x2="232" y2="255" stroke="#475569" stroke-width="2"/>
      <line x1="215" y1="262" x2="232" y2="262" stroke="#475569" stroke-width="2"/>
      <text x="200" y="278" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" fill="#94A3B8" text-anchor="middle">AUTO-STOP · USB-C</text>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Máy Bơm Lốp Điện Tử Cầm Tay</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">199.000 ₫</text>
</svg>
