<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#059669"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TOPGIA</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-topgia-mint" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#A7F3D0"/>
          <stop offset="50%" stop-color="#34D399"/>
          <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="g-tissue-white" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
        <radialGradient id="g-glow-1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(52, 211, 153, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="220" rx="120" ry="100" fill="url(#g-glow-1)"/>
      <ellipse cx="200" cy="315" rx="85" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Hanging Loop -->
      <path d="M190 100 Q200 80 210 100" fill="none" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
      <circle cx="200" cy="85" r="4" fill="#64748B"/>
      <!-- Main Hanging Pack Body -->
      <rect x="145" y="100" width="110" height="175" rx="14" fill="url(#g-topgia-mint)" stroke="#047857" stroke-width="2.5"/>
      <!-- Decorative Stripe & Branding -->
      <rect x="145" y="140" width="110" height="50" fill="rgba(255,255,255,0.22)"/>
      <text x="200" y="165" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TOPGIA</text>
      <text x="200" y="180" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ECFDF5" text-anchor="middle">1280 TỜ · 4 LỚP TỰ NHIÊN</text>
      <!-- Bottom Dispenser Slit & Tissue Wave -->
      <rect x="165" y="270" width="70" height="6" rx="3" fill="#064E3B"/>
      <path d="M170 273 C180 295 190 305 200 290 C210 305 220 295 230 273 Z" fill="url(#g-tissue-white)" stroke="#CBD5E1" stroke-width="1.5"/>
      <path d="M180 288 C195 300 205 300 220 288" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- 3D Specular Sheen -->
      <path d="M152 108 L152 265" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Túi Treo 1280 Tờ (4 Lớp)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">38.000 ₫</text>
</svg>
