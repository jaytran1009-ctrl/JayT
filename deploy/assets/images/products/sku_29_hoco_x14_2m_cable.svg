<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="rgba(229,195,120,0.12)"/>
  
  <!-- Top Brand &amp; Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#DC2626"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HOCO</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Cáp sạc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Hoco Red Braided 2M Extra Long Cable -->
      <ellipse cx="200" cy="210" rx="65" ry="40" fill="none" stroke="#DC2626" stroke-width="10" stroke-dasharray="10 4"/>
      <!-- Solid Aluminum Head -->
      <rect x="130" y="175" width="26" height="14" rx="4" fill="#1E293B" stroke="#DC2626" stroke-width="2"/>
      <rect x="118" y="177" width="12" height="10" rx="2" fill="#CBD5E1"/>
      <rect x="245" y="175" width="26" height="14" rx="4" fill="#1E293B" stroke="#DC2626" stroke-width="2"/>
      <rect x="271" y="177" width="12" height="10" rx="2" fill="#CBD5E1"/>
      <text x="200" y="215" font-family="sans-serif" font-size="14" font-weight="900" fill="#DC2626" text-anchor="middle">2 METERS</text>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">X14 Type-C 3A (2M Extra Long)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="end">45.000 ₫</text>
</svg>
