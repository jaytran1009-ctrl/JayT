<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="window-sky-co" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="room-wood-co" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <filter id="lamp-glow-co" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  
  <!-- Panoramic Glass Window facing Han River -->
  <rect width="1200" height="420" fill="url(#window-sky-co)"/>
  
  <!-- Han River Surface & Dragon Bridge visible outside window -->
  <rect x="0" y="260" width="1200" height="160" fill="#0284c7" opacity="0.6"/>
  <path d="M 200 320 Q 600 180 1000 320" stroke="#f59e0b" stroke-width="8" fill="none" opacity="0.75"/>
  
  <!-- Library Window Frame -->
  <rect x="0" y="0" width="1200" height="420" fill="none" stroke="#1e293b" stroke-width="24"/>
  <line x1="400" y1="0" x2="400" y2="420" stroke="#1e293b" stroke-width="16"/>
  <line x1="800" y1="0" x2="800" y2="420" stroke="#1e293b" stroke-width="16"/>
  
  <!-- Library Wooden Floor & Reading Desk -->
  <rect x="0" y="420" width="1200" height="255" fill="url(#room-wood-co)"/>
  
  <!-- Grand Wooden Study Table with Reading Lamps -->
  <rect x="150" y="450" width="900" height="180" rx="16" fill="#78350f" stroke="#9a3412" stroke-width="4"/>
  
  <!-- Desk Warm Light Cones -->
  <circle cx="350" cy="460" r="90" fill="#fef08a" opacity="0.3" filter="url(#lamp-glow-co)"/>
  <circle cx="850" cy="460" r="90" fill="#fef08a" opacity="0.3" filter="url(#lamp-glow-co)"/>
  
  <!-- Open Books & Laptops -->
  <g transform="translate(320, 480)">
    <polygon points="0,0 50,-15 100,0 50,15" fill="#ffffff"/>
    <polygon points="0,0 -50,-15 -100,0 -50,15" fill="#f8fafc"/>
  </g>
  <g transform="translate(820, 480)">
    <polygon points="0,0 50,-15 100,0 50,15" fill="#ffffff"/>
    <polygon points="0,0 -50,-15 -100,0 -50,15" fill="#f8fafc"/>
  </g>
  
  <!-- Editorial Tag -->
  <g transform="translate(48, 48)">
    <rect width="440" height="38" rx="19" fill="#0f172a" fill-opacity="0.8" stroke="#d8b4fe" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="220" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">&#128218; TH&#431; VI&#7878;N KHTH &#272;&#192; N&#7864;NG &#8226; 46 B&#7840;CH &#272;&#7856;NG</text>
  </g>
</svg>