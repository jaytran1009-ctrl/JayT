<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg_lotteria" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="70%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <filter id="shadow_lotte" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg_lotteria)"/>
  <circle cx="530" cy="90" r="140" fill="#ffffff" fill-opacity="0.08"/>

  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.25"/>
    <text x="80" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">LOTTERIA TRƯA 45K</text>
  </g>
  <g transform="translate(430, 40)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#000000" fill-opacity="0.45"/>
    <text x="80" y="17" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HÌNH MINH HỌA CHUẨN</text>
  </g>

  <!-- Burger &amp; Chicken Vector Graphics -->
  <g transform="translate(320, 205)" filter="url(#shadow_lotte)">
    <!-- Drink Cup -->
    <g transform="translate(35, -70)">
      <polygon points="10,0 50,0 45,120 15,120" fill="#ffffff"/>
      <rect x="5" y="0" width="50" height="12" rx="3" fill="#DC2626"/>
      <line x1="30" y1="-25" x2="30" y2="0" stroke="#FBBF24" stroke-width="5"/>
    </g>
    <!-- Burger -->
    <g transform="translate(-75, -50)">
      <!-- Top Bun -->
      <path d="M0 40 Q50 0 100 40 Z" fill="#F59E0B"/>
      <!-- Sesame seeds -->
      <circle cx="35" cy="22" r="2.5" fill="#ffffff"/>
      <circle cx="55" cy="18" r="2.5" fill="#ffffff"/>
      <circle cx="75" cy="24" r="2.5" fill="#ffffff"/>
      <!-- Greens &amp; Patty -->
      <rect x="-5" y="40" width="110" height="10" rx="3" fill="#10B981"/>
      <rect x="0" y="50" width="100" height="18" rx="5" fill="#78350F"/>
      <rect x="-3" y="68" width="106" height="8" rx="3" fill="#FBBF24"/>
      <!-- Bottom Bun -->
      <rect x="5" y="76" width="90" height="20" rx="8" fill="#F59E0B"/>
    </g>
  </g>

  <g transform="translate(50, 315)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">Combo Ria's Lunch Lotteria</text>
    <text x="0" y="30" fill="#FEF08A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Burger tôm/bò + Pepsi &#8226; Giá sinh viên từ 45.000₫</text>
  </g>
  <rect x="0" y="394" width="640" height="6" fill="#FBBF24"/>
</svg>