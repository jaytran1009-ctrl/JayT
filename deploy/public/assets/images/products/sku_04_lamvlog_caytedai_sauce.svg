<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#DC2626"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">LÂM VLOG</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Đồ ăn vặt & Gia vị</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-chili-red" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#DC2626"/>
          <stop offset="50%" stop-color="#EF4444"/>
          <stop offset="100%" stop-color="#991B1B"/>
        </linearGradient>
        <linearGradient id="g-sauce-label" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FEF08A"/>
          <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <radialGradient id="g-glow-4" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(239, 68, 68, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-4)"/>
      <ellipse cx="200" cy="315" rx="70" ry="12" fill="rgba(10,17,13,0.85)"/>
      <!-- Bottle Cap & Neck -->
      <rect x="186" y="90" width="28" height="22" rx="4" fill="#18181B" stroke="#71717A" stroke-width="1.5"/>
      <rect x="183" y="112" width="34" height="8" rx="2" fill="#DC2626"/>
      <!-- Glass Bottle Neck -->
      <path d="M188 120 L188 140 L162 170 L162 280 Q162 295 175 295 L225 295 Q238 295 238 280 L238 170 L212 140 L212 120 Z" fill="url(#g-chili-red)" stroke="#7F1D1D" stroke-width="2.5"/>
      <!-- Spicy Seeds & Flakes inside sauce -->
      <circle cx="180" cy="180" r="2.5" fill="#FEF08A"/>
      <circle cx="215" cy="190" r="2" fill="#FDE047"/>
      <circle cx="175" cy="230" r="2" fill="#FEF08A"/>
      <circle cx="222" cy="245" r="2.5" fill="#FDE047"/>
      <circle cx="190" cy="270" r="2" fill="#FEF08A"/>
      <!-- High-Contrast Sauce Label -->
      <rect x="166" y="195" width="68" height="65" rx="6" fill="url(#g-sauce-label)" stroke="#B45309" stroke-width="1.5"/>
      <text x="200" y="212" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">LÂM VLOG</text>
      <text x="200" y="226" font-family="-apple-system, sans-serif" font-size="11" font-weight="950" fill="#DC2626" text-anchor="middle">CAYTEDAI</text>
      <text x="200" y="240" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#B45309" text-anchor="middle">⚡ X2 SIÊU CAY ⚡</text>
      <text x="200" y="252" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#78350F" text-anchor="middle">MUỐI ỚT ĐẶC SẢN</text>
      <!-- Glass Specular Highlight -->
      <path d="M168 175 L168 285" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Sốt Muối Chấm Cay Tê Dại x2</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">35.000 ₫</text>
</svg>
