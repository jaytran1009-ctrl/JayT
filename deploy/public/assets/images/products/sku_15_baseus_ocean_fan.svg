<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#DC2626"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">RACING BOY</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Cá nhân & Di chuyển</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-gold-canister" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#F59E0B"/>
          <stop offset="50%" stop-color="#FDE68A"/>
          <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>
        <linearGradient id="g-red-coil" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#EF4444"/>
          <stop offset="50%" stop-color="#F87171"/>
          <stop offset="100%" stop-color="#991B1B"/>
        </linearGradient>
        <radialGradient id="g-glow-15" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(239, 68, 68, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-15)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Top Mounting Eyelet Ring -->
      <circle cx="180" cy="85" r="14" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="180" cy="85" r="6" fill="#0F172A"/>
      <!-- External Gold Gas Reservoir Canister (Piggyback) -->
      <rect x="215" y="90" width="34" height="60" rx="8" fill="url(#g-gold-canister)" stroke="#92400E" stroke-width="1.5"/>
      <rect x="219" y="112" width="26" height="14" fill="#000000"/>
      <text x="232" y="122" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">RCB</text>
      <!-- Damper Rod Chrome Core -->
      <rect x="175" y="98" width="10" height="175" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
      <!-- Heavy-Duty Red Racing Spring Coils -->
      <path d="M165 140 Q180 130 195 140" fill="none" stroke="url(#g-red-coil)" stroke-width="10" stroke-linecap="round"/>
      <path d="M165 165 Q180 155 195 165" fill="none" stroke="url(#g-red-coil)" stroke-width="10" stroke-linecap="round"/>
      <path d="M165 190 Q180 180 195 190" fill="none" stroke="url(#g-red-coil)" stroke-width="10" stroke-linecap="round"/>
      <path d="M165 215 Q180 205 195 215" fill="none" stroke="url(#g-red-coil)" stroke-width="10" stroke-linecap="round"/>
      <path d="M165 240 Q180 230 195 240" fill="none" stroke="url(#g-red-coil)" stroke-width="10" stroke-linecap="round"/>
      <!-- Bottom Rebound Adjustment Knob & Fork Base -->
      <polygon points="168,265 192,265 188,290 172,290" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="180" cy="282" r="4" fill="#F59E0B"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Phuộc RCB Flow-S Bình Dầu Rời</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">850.000 ₫</text>
</svg>
