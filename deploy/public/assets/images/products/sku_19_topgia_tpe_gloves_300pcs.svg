<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#059669"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TOPGIA</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-glove-mint" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#34D399"/>
          <stop offset="50%" stop-color="#059669"/>
          <stop offset="100%" stop-color="#047857"/>
        </linearGradient>
        <radialGradient id="g-glow-19" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(52, 211, 153, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-19)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Top Wall Hanging Notch -->
      <circle cx="200" cy="95" r="5" fill="none" stroke="#A7F3D0" stroke-width="3"/>
      <!-- Dispenser Bag Box Container -->
      <rect x="145" y="105" width="110" height="165" rx="14" fill="url(#g-glove-mint)" stroke="#065F46" stroke-width="2.5"/>
      <!-- Front Glove Icon Outline -->
      <circle cx="200" cy="155" r="22" fill="#FFFFFF" opacity="0.95"/>
      <text x="200" y="163" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">🧤</text>
      <!-- Details -->
      <text x="200" y="195" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GĂNG TAY TPE</text>
      <text x="200" y="208" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#FEF08A" text-anchor="middle">BỊCH 300 CÁI DẠNG RÚT</text>
      <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#E6FFFA" text-anchor="middle">THỰC PHẨM · CO GIÃN TỐT</text>
      <!-- Bottom Dispenser Slit -->
      <rect x="170" y="250" width="60" height="6" rx="3" fill="#064E3B"/>
      <!-- Clear TPE Glove Emerging -->
      <path d="M178 253 Q200 280 222 253" fill="rgba(255,255,255,0.6)" stroke="#CBD5E1" stroke-width="1.5"/>
      <path d="M152 115 L152 260" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Găng Tay TPE Rút (300 Cái)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">29.000 ₫</text>
</svg>
