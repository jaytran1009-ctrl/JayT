<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#EA580C"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ĂN CÙNG BÀ TUYẾT</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Đồ ăn vặt & Gia vị</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-pouch-orange" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FB923C"/>
          <stop offset="50%" stop-color="#EA580C"/>
          <stop offset="100%" stop-color="#C2410C"/>
        </linearGradient>
        <radialGradient id="g-glow-7" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(234, 88, 12, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-7)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Foil Pouch Outline -->
      <path d="M145 105 L255 105 L250 285 L150 285 Z" fill="url(#g-pouch-orange)" stroke="#9A3412" stroke-width="2.5"/>
      <!-- Top Tear Notch -->
      <line x1="145" y1="120" x2="255" y2="120" stroke="#7C2D12" stroke-width="1" stroke-dasharray="3,3"/>
      <polygon points="145,120 152,116 152,124" fill="#0A110D"/>
      <polygon points="255,120 248,116 248,124" fill="#0A110D"/>
      <!-- Golden Center Window showing seasoned chicken feet -->
      <rect x="156" y="165" width="88" height="65" rx="12" fill="#7C2D12" stroke="#FDE047" stroke-width="2"/>
      <!-- Chicken Feet graphic -->
      <path d="M175 195 Q190 185 200 195 Q210 185 225 195" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
      <path d="M185 210 Q200 200 215 210" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="185" cy="188" r="2.5" fill="#EF4444"/>
      <circle cx="215" cy="188" r="2" fill="#EF4444"/>
      <!-- Brand Mascot Badge -->
      <circle cx="200" cy="140" r="16" fill="#FEF08A" stroke="#B45309" stroke-width="1.5"/>
      <text x="200" y="144" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#9A3412" text-anchor="middle">👵</text>
      <!-- Title & Details -->
      <text x="200" y="248" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CHÂN GÀ RÚT XƯƠNG</text>
      <text x="200" y="260" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#FEF08A" text-anchor="middle">ĂN CÙNG BÀ TUYẾT · M11</text>
      <text x="200" y="272" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#FED7AA" text-anchor="middle">⚡ CAY GIÒN SẦN SẬT</text>
      <!-- Specular Pouch Reflection -->
      <path d="M152 115 L155 275" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Chân Gà Rút Xương M11</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">34.000 ₫</text>
</svg>
