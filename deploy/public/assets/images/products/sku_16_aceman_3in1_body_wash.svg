<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0EA5E9"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ACEMAN</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Cá nhân & Di chuyển</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-aceman-black" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="50%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <radialGradient id="g-glow-16" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(14, 165, 233, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-16)"/>
      <ellipse cx="200" cy="315" rx="75" ry="12" fill="rgba(10,17,13,0.85)"/>
      <!-- Pump Head Dispenser -->
      <rect x="194" y="85" width="12" height="22" fill="#64748B"/>
      <path d="M190 85 L225 80 L225 90 L205 90 Z" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="188" y="107" width="24" height="8" rx="2" fill="#0284C7"/>
      <!-- Masculine Matte Black Bottle Body -->
      <rect x="155" y="115" width="90" height="175" rx="16" fill="url(#g-aceman-black)" stroke="#38BDF8" stroke-width="2"/>
      <!-- Luxury Metallic Typography & Divider -->
      <text x="200" y="165" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">ACEMAN</text>
      <text x="200" y="180" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1">MEN CARE</text>
      <line x1="175" y1="190" x2="225" y2="190" stroke="#0284C7" stroke-width="1.5"/>
      <text x="200" y="210" font-family="-apple-system, sans-serif" font-size="11" font-weight="950" fill="#38BDF8" text-anchor="middle">3 IN 1</text>
      <text x="200" y="224" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#CBD5E1" text-anchor="middle">TẮM · GỘI · RỬA MẶT</text>
      <text x="200" y="240" font-family="-apple-system, sans-serif" font-size="7" font-weight="600" fill="#94A3B8" text-anchor="middle">HƯƠNG NƯỚC HOA PHÁP · 320ML</text>
      <!-- Specular Highlight Line -->
      <path d="M162 125 L162 275" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Sữa Tắm Nước Hoa Nam 3in1 (320ml)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">89.000 ₫</text>
</svg>
