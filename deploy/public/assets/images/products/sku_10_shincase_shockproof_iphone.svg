<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#2563EB"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SHIN CASE</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Phụ kiện điện thoại</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-clear-case" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
          <stop offset="50%" stop-color="rgba(224, 242, 254, 0.3)"/>
          <stop offset="100%" stop-color="rgba(186, 230, 253, 0.6)"/>
        </linearGradient>
        <radialGradient id="g-glow-10" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(56, 189, 248, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-10)"/>
      <ellipse cx="200" cy="315" rx="75" ry="12" fill="rgba(10,17,13,0.85)"/>
      <!-- Clear Shockproof Case -->
      <rect x="150" y="95" width="100" height="195" rx="20" fill="url(#g-clear-case)" stroke="#38BDF8" stroke-width="2"/>
      <!-- 4 Reinforced Air-Cushion Bumpers on 4 Corners -->
      <circle cx="152" cy="98" r="10" fill="#0284C7" opacity="0.4" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="248" cy="98" r="10" fill="#0284C7" opacity="0.4" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="152" cy="287" r="10" fill="#0284C7" opacity="0.4" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="248" cy="287" r="10" fill="#0284C7" opacity="0.4" stroke="#38BDF8" stroke-width="2"/>
      <!-- Raised Camera Protection Rim -->
      <rect x="158" y="104" width="40" height="42" rx="9" fill="rgba(2, 132, 199, 0.2)" stroke="#0284C7" stroke-width="2"/>
      <circle cx="170" cy="116" r="5" fill="#0369A1"/>
      <circle cx="170" cy="134" r="5" fill="#0369A1"/>
      <circle cx="186" cy="125" r="5" fill="#0369A1"/>
      <!-- Center Anti-watermark Micro Dot Matrix & Badge -->
      <rect x="165" y="170" width="70" height="90" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
      <text x="200" y="210" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#0284C7" text-anchor="middle" letter-spacing="1">SHIN CASE</text>
      <text x="200" y="224" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#0369A1" text-anchor="middle">AIR-BAG SHOCKPROOF</text>
      <text x="200" y="235" font-family="-apple-system, sans-serif" font-size="6" font-weight="600" fill="#64748B" text-anchor="middle">ANTI-YELLOW TPU</text>
      <!-- Edge Sheen -->
      <path d="M154 115 L154 270" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Ốp Chống Sốc 4 Góc Túi Khí</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">15.000 ₫</text>
</svg>
