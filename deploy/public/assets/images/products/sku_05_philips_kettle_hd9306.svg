<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#D97706"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TIỂU HẠ</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-bamboo-ochre" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FBBF24"/>
          <stop offset="50%" stop-color="#D97706"/>
          <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>
        <radialGradient id="g-glow-5" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-5)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Wall Hanging Hole -->
      <circle cx="200" cy="95" r="6" fill="none" stroke="#FDE68A" stroke-width="3"/>
      <!-- Bamboo Pack Main Rectangle -->
      <rect x="145" y="105" width="110" height="165" rx="12" fill="url(#g-bamboo-ochre)" stroke="#92400E" stroke-width="2.5"/>
      <!-- Bamboo Stalk Illustration Motif -->
      <path d="M160 120 L160 250" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
      <path d="M156 150 Q165 145 170 150" stroke="#78350F" stroke-width="2" fill="none"/>
      <path d="M156 190 Q165 185 170 190" stroke="#78350F" stroke-width="2" fill="none"/>
      <!-- Label Center Box -->
      <rect x="155" y="150" width="90" height="58" rx="8" fill="rgba(255,255,255,0.92)" stroke="#B45309" stroke-width="1.5"/>
      <text x="200" y="172" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#92400E" text-anchor="middle" letter-spacing="1">TIỂU HẠ</text>
      <text x="200" y="188" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="middle">BỘT TRE TỰ NHIÊN</text>
      <text x="200" y="200" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#78350F" text-anchor="middle">1000 TỜ · SIÊU DAI</text>
      <!-- Bottom Paper Pull Out -->
      <path d="M165 265 L235 265 L220 295 L180 295 Z" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
      <path d="M152 112 L152 255" stroke="rgba(255,255,255,0.35)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Khăn Giấy Tre 1000 Tờ Treo Tường</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">29.000 ₫</text>
</svg>
