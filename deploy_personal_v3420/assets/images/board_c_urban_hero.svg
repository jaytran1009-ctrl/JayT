<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
      <defs>
        <linearGradient id="urban-bg-c" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a"/>
          <stop offset="50%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
      </defs>
      
      <!-- Urban Dark Grid Background -->
      <rect width="1200" height="500" fill="url(#urban-bg-c)"/>
      
      <!-- Transit & City Route Vector Lines -->
      <g stroke-width="4" opacity="0.4">
        <line x1="0" y1="150" x2="1200" y2="150" stroke="#334155"/>
        <line x1="0" y1="300" x2="1200" y2="300" stroke="#334155"/>
        <line x1="300" y1="0" x2="300" y2="500" stroke="#334155"/>
        <line x1="600" y1="0" x2="600" y2="500" stroke="#334155"/>
        <line x1="900" y1="0" x2="900" y2="500" stroke="#334155"/>
      </g>
      
      <!-- Glowing Metro Route Lines -->
      <path d="M 100 400 L 350 250 L 600 250 L 850 150 L 1100 150" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M 100 200 L 400 350 L 750 350 L 1050 420" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none"/>
      
      <!-- Route Stops / Waypoints -->
      <circle cx="350" cy="250" r="14" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
      <circle cx="600" cy="250" r="14" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
      <circle cx="850" cy="150" r="14" fill="#ffffff" stroke="#10b981" stroke-width="6"/>
      
      <!-- Board Badge -->
      <g transform="translate(400, 40)">
        <rect width="400" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.5"/>
        <text x="200" y="26" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1.5">BOARD C &#8226; THÀNH PHỐ TRONG MỘT NGÀY</text>
      </g>
    </svg>