<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0F172A"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BASEUS</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Đèn bàn</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Baseus Smart Eye Minimalist Arc -->
      <ellipse cx="180" cy="285" rx="40" ry="10" fill="#0F172A"/>
      <path d="M180 280 L180 180 Q180 140 230 140 L280 140" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
      <!-- Sleek Strip LED -->
      <line x1="220" y1="140" x2="280" y2="140" stroke="#F8FAFC" stroke-width="4"/>
      <!-- Smart Eye Sensor -->
      <circle cx="180" cy="200" r="4" fill="#0284C7"/>
      <polygon points="230,146 200,250 300,250 280,146" fill="#BAE6FD" opacity="0.3"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Smart Eye Series (Auto-Dim)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end">450.000 ₫</text>
</svg>
