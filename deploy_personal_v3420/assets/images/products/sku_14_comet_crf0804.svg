  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#F97316"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">COMET</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Quạt kẹp KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Comet Desk Clip Fan -->
      <path d="M150 280 Q170 260 200 260 Q230 260 250 280 Z" fill="#F97316"/>
      <rect x="194" y="220" width="12" height="45" rx="3" fill="#475569"/>
      <circle cx="200" cy="160" r="50" fill="#FFF7ED" stroke="#EA580C" stroke-width="4"/>
      <circle cx="200" cy="160" r="12" fill="#F97316"/>
      <ellipse cx="200" cy="130" rx="8" ry="18" fill="#FDBA74"/>
      <ellipse cx="200" cy="190" rx="8" ry="18" fill="#FDBA74"/>
      <ellipse cx="170" cy="160" rx="18" ry="8" fill="#FDBA74"/>
      <ellipse cx="230" cy="160" rx="18" ry="8" fill="#FDBA74"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">CRF0804 (Ultra Silent 3W)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F97316" text-anchor="end">175.000 ₫</text>
