<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="100%" height="100%">
  <defs>
    <linearGradient id="coastal-sky-cm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="85%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="sea-grad-cm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sand-grad-cm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="coastal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  
  <!-- Sky -->
  <rect width="1440" height="640" fill="url(#coastal-sky-cm)"/>
  
  <!-- Gentle Morning Sun -->
  <circle cx="1150" cy="160" r="80" fill="#fde047" opacity="0.85"/>
  <circle cx="1150" cy="160" r="110" fill="#fef08a" opacity="0.3" filter="url(#coastal-glow)"/>
  
  <!-- Distant Son Tra Peninsula Silhouette -->
  <path d="M 800 380 Q 1050 260 1440 340 L 1440 440 L 800 440 Z" fill="#0369a1" opacity="0.35"/>
  <path d="M 950 380 Q 1180 290 1440 360 L 1440 440 L 950 440 Z" fill="#0284c7" opacity="0.5"/>
  
  <!-- Sparkling Ocean Horizon -->
  <rect x="0" y="360" width="1440" height="130" fill="url(#sea-grad-cm)"/>
  
  <!-- Gentle Ocean Surf Waves -->
  <path d="M 0 460 Q 360 440 720 460 Q 1080 480 1440 460 L 1440 510 L 0 510 Z" fill="#38bdf8" opacity="0.6"/>
  <path d="M 0 485 Q 360 475 720 485 Q 1080 495 1440 485 L 1440 520 L 0 520 Z" fill="#ffffff" opacity="0.75"/>
  
  <!-- My Khe Warm Sand Coastline -->
  <rect x="0" y="500" width="1440" height="140" fill="url(#sand-grad-cm)"/>
  
  <!-- Dragon Bridge Modern Iconic Vector Arc -->
  <path d="M 120 490 Q 380 230 640 400 Q 900 230 1160 490" stroke="#f59e0b" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 120 490 Q 380 250 640 410 Q 900 250 1160 490" stroke="#ef4444" stroke-width="4" fill="none" opacity="0.7"/>
  <line x1="80" y1="490" x2="1200" y2="490" stroke="#94a3b8" stroke-width="6"/>
</svg>