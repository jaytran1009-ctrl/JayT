<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#D97706"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ĐIỆN QUANG</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Đèn bàn</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Dien Quang Touch Lamp -->
      <rect x="150" y="270" width="70" height="20" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
      <line x1="185" y1="270" x2="185" y2="150" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
      <!-- Horizontal Swivel Bar -->
      <rect x="150" y="140" width="110" height="16" rx="8" fill="#D97706"/>
      <!-- Light Cone -->
      <polygon points="160,158 120,260 250,260 250,158" fill="#FDE68A" opacity="0.2"/>
      <circle cx="185" cy="278" r="4" fill="#D97706"/>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">ĐQ DKL14 (Touch 3-Mode)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="end">220.000 ₫</text>
</svg>
