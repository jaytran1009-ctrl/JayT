<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="#CBD5E1" opacity="0.4"/>
  
  <!-- Top Brand & Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#10B981"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">UGREEN</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">Cáp sạc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Ugreen Gray Nylon Cable -->
      <ellipse cx="200" cy="210" rx="55" ry="30" fill="none" stroke="#64748B" stroke-width="8" stroke-dasharray="6 3"/>
      <!-- Type-C Plug -->
      <rect x="135" y="180" width="22" height="12" rx="3" fill="#10B981"/>
      <rect x="124" y="182" width="11" height="8" rx="2" fill="#94A3B8"/>
      <!-- Lightning Plug -->
      <rect x="240" y="180" width="22" height="12" rx="3" fill="#10B981"/>
      <rect x="262" y="183" width="10" height="6" rx="1" fill="#E2E8F0"/>
      <text x="200" y="215" font-family="sans-serif" font-size="12" font-weight="900" fill="#10B981" text-anchor="middle">MFi PD 20W</text>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Type-C to Lightning MFi (1M)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">165.000 ₫</text>
</svg>
