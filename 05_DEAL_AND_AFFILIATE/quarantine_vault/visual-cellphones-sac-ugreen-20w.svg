<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="700" cy="80" r="160" fill="#FFFFFF" fill-opacity="0.08" />
  <circle cx="100" cy="420" r="180" fill="#FFFFFF" fill-opacity="0.05" />

  <!-- Center Card Illustration Box -->
  <rect x="50" y="40" width="700" height="420" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Top Badge -->
  <rect x="80" y="70" width="180" height="36" rx="8" fill="#DC2626" />
  <text x="170" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CELLPHONES</text>

  <!-- Center Icon / Illustration -->
  <g transform="translate(400, 220) scale(1.2)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#FFFFFF" /><rect x="-8" y="25" width="4" height="12" fill="#94A3B8" /><rect x="4" y="25" width="4" height="12" fill="#94A3B8" /><rect x="-10" y="-12" width="20" height="6" rx="2" fill="#10B981" />
  </g>

  <!-- Title & Subtitle Banner -->
  <rect x="70" y="340" width="660" height="100" rx="14" fill="#0B1017" fill-opacity="0.85" />
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">CỦ SẠC NHANH UGREEN 20W TYPE-C PD CHÍNH HÃNG</text>
  <text x="100" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">Sạc nhanh chuẩn Power Delivery · Chip bảo vệ quá nhiệt an toàn</text>
</svg>