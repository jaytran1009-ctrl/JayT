<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>JayT Đà Nẵng 43 — Theo Dõi Lịch Tiết Kiệm Nguồn Công Khai</title>
  <meta name="description" content="JayT Đà Nẵng 43 — Theo dõi lịch ưu đãi định kỳ từ nguồn công khai cho sinh viên và người đi làm Đà Nẵng. Minh bạch, riêng tư, 0 quảng cáo ảo.">
  <meta name="keywords" content="JayT, Đà Nẵng, lịch tiết kiệm 7 ngày, rạp phim đà nẵng, cà phê đà nẵng, ưu đãi đà nẵng">
  <meta name="author" content="JayT Đà Nẵng Community Value Project">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="jayt_gold_icon.ico">

  <!-- Typography: Outfit, Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       JAYT DESIGN SYSTEM — 045D TRUE RESPONSIVE LIGHT LUXURY (NO MASKING)
       ========================================================================== */
    :root {
      --bg-app-base: #F8FAF9;
      --bg-card-white: #FFFFFF;
      --bg-card-glass: rgba(255, 255, 255, 0.96);
      --bg-surface-subtle: #EEF2F0;

      --pine-forest-deep: #082118;
      --pine-forest-main: #0F3327;
      --pine-forest-soft: rgba(15, 51, 39, 0.07);

      --gold-champagne: #C59B27;
      --gold-champagne-light: #F9F1D8;
      --gold-champagne-bright: #D4AF37;
      --gold-champagne-dark: #8C6D14;

      --sapphire-deep: #0F172A;
      --gradient-hero: linear-gradient(135deg, #0F3327 0%, #1E293B 60%, #172554 100%);

      --text-charcoal-deep: #0F172A;
      --text-charcoal-main: #1E293B;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;

      --border-subtle: rgba(15, 51, 39, 0.12);
      --border-gold: rgba(197, 155, 39, 0.4);

      --shadow-sm: 0 2px 6px rgba(15, 51, 39, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 51, 39, 0.08);

      --status-verified-bg: #ECFDF5;
      --status-verified-text: #059669;
      --status-verified-border: #A7F3D0;

      --status-recheck-bg: #FFFBEB;
      --status-recheck-text: #D97706;
      --status-recheck-border: #FDE68A;

      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;

      --touch-min: 44px;
      --duration-fast: 160ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--bg-app-base);
      color: var(--text-charcoal-main);
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #jayt-apex {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="jayt-apex"></div>

  <!-- CORE SCRIPT -->
  <script src="jayt_apex_interface.js"></script>
</body>
</html>
