    <script type="text/javascript">
        var ID_txtSearch = 'txtSearch';
        $(function () {
            var Input = $('#' + ID_txtSearch);
            var default_value = Input.val();
            if (default_value == '') {
                alert('Bạn phải nhập dữ liệu mới tìm kiếm được!');
            }
            else {
                $(Input).focus(function () {
                    if ($(this).val() == default_value) {
                        $(this).val("");
                    }
                }).blur(function () {
                    if ($(this).val().length == 0) /*Small update*/ {
                        $(this).val(default_value);
                    }
                });
            }
        });


        function clickButton(e, buttonid) {
            var evt = e ? e : window.event;
            var bt = document.getElementById(buttonid);


            if (bt) {
                if (evt.keyCode == 13) {
                    var Input = $('#' + ID_txtSearch);
                    var default_value = Input.val();
                    if (default_value == '') {
                        alert('Vui lòng nhập ký tự vào để tìm kiếm!');
                        return false;
                    } else {
                        bt.click();
                        return false;
                    }
                }
            }

        }

        $(function () {
            $("#txtSearch").autocomplete({
            source: function (request, response) {
                $.ajax({
                    url: '/modules/page/funcs/main.aspx/GetSearchHint',
                    data: "{ 'prefix': '" + request.term + "'}",
                    dataType: "json",
                    type: "POST",
                    contentType: "application/json; charset=utf-8",

                    success: function (data) {
                        response($.map(data.d, function (item) {
                            var itemt = item.split("|");
                            return {

                                label: itemt[1],
                                val: itemt[0]
                            }
                        }))
                        //console.log(data.d);
                        //var availableTags = [data.d];
                        //response(
                        //availableTags
                        //    )

                    },
                    error: function (response) {
                        // alert(response.responseText);
                    },
                    failure: function (response) {
                        //  alert(response.responseText);
                    }
                });
            },
            select: function (e, i) {
                $("#txtSearch").val(i.item.label);
                window.location.href = i.item.val;

            },
            minLength: 1
        });
    });
        function reLoadPage() {
            window.location.reload();
        }
    </script>
