<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#2563EB"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SHIN CASE</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Phụ kiện điện thoại</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-case-navy" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="50%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <linearGradient id="g-lens-metal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#94A3B8"/>
          <stop offset="100%" stop-color="#475569"/>
        </linearGradient>
        <radialGradient id="g-glow-2" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(37, 99, 235, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-2)"/>
      <ellipse cx="200" cy="315" rx="75" ry="12" fill="rgba(10,17,13,0.85)"/>
      <!-- Phone Case Silhouette -->
      <rect x="150" y="95" width="100" height="195" rx="22" fill="url(#g-case-navy)" stroke="#38BDF8" stroke-width="2"/>
      <!-- Camera Island Raised Bumper -->
      <rect x="158" y="104" width="42" height="45" rx="10" fill="#0B1329" stroke="#64748B" stroke-width="1.5"/>
      <!-- Triple Lenses -->
      <circle cx="170" cy="116" r="6" fill="url(#g-lens-metal)"/>
      <circle cx="170" cy="116" r="3" fill="#0284C7"/>
      <circle cx="170" cy="136" r="6" fill="url(#g-lens-metal)"/>
      <circle cx="170" cy="136" r="3" fill="#0284C7"/>
      <circle cx="188" cy="126" r="6" fill="url(#g-lens-metal)"/>
      <circle cx="188" cy="126" r="3" fill="#0284C7"/>
      <circle cx="188" cy="112" r="2" fill="#F8FAFC"/>
      <!-- Inner Velvet Texture lines -->
      <rect x="162" y="165" width="76" height="105" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#94A3B8" text-anchor="middle" letter-spacing="1">SHIN CASE</text>
      <text x="200" y="234" font-family="-apple-system, sans-serif" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle">MIL-STD VELVET TPU</text>
      <!-- Rim Specular Sheen -->
      <path d="M156 115 Q156 270 170 282" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Ốp TPU Lót Nhung iPhone</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">18.000 ₫</text>
</svg>
