<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#EC4899"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CHUCHOE BABY</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Gia dụng KTX</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-baby-blue" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#BAE6FD"/>
          <stop offset="50%" stop-color="#7DD3FC"/>
          <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
        <radialGradient id="g-glow-11" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(236, 72, 153, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-11)"/>
      <ellipse cx="200" cy="315" rx="85" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Folded Baby Sleepwear Set Top -->
      <path d="M150 110 L180 100 L220 100 L250 110 L270 150 L245 160 L235 140 L235 220 L165 220 L165 140 L155 160 L130 150 Z" fill="url(#g-baby-blue)" stroke="#0284C7" stroke-width="2"/>
      <!-- Soft Neck Rib -->
      <path d="M185 100 Q200 115 215 100" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <!-- Cute Dinosaur / Cloud Motif Pattern -->
      <circle cx="200" cy="155" r="18" fill="#FFFFFF" opacity="0.85"/>
      <text x="200" y="161" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">🦕</text>
      <!-- Label on Hem -->
      <rect x="180" y="195" width="40" height="15" rx="3" fill="#FFFFFF" stroke="#F472B6" stroke-width="1"/>
      <text x="200" y="206" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="800" fill="#DB2777" text-anchor="middle">CHUCHOE</text>
      <!-- Pants Folded Underneath -->
      <path d="M168 220 L195 220 L195 285 L168 285 Z" fill="#FBCFE8" stroke="#F472B6" stroke-width="2"/>
      <path d="M205 220 L232 220 L232 285 L205 285 Z" fill="#FBCFE8" stroke="#F472B6" stroke-width="2"/>
      <!-- Elastic Cuff Details -->
      <rect x="168" y="278" width="27" height="7" fill="#F472B6"/>
      <rect x="205" y="278" width="27" height="7" fill="#F472B6"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Bộ Thun Lạnh Dài Tay Cho Bé</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">49.000 ₫</text>
</svg>
