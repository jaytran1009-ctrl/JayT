<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#3B82F6"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BLUECLOUDS</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Học tập & Công nghệ</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-tws-case" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="50%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <radialGradient id="g-glow-12" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(59, 130, 246, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-12)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Pebble Charging Case Body -->
      <rect x="150" y="145" width="100" height="95" rx="28" fill="url(#g-tws-case)" stroke="#3B82F6" stroke-width="2.5"/>
      <!-- Case Lid Open Seam Line -->
      <path d="M150 180 L250 180" stroke="#64748B" stroke-width="1.5"/>
      <!-- Earbud 1 Left -->
      <rect x="168" y="105" width="16" height="42" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="176" cy="112" r="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="176" cy="112" r="4" fill="#3B82F6"/>
      <!-- Earbud 2 Right -->
      <rect x="216" y="105" width="16" height="42" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="224" cy="112" r="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="224" cy="112" r="4" fill="#3B82F6"/>
      <!-- LED Power Status Indicator Dot -->
      <circle cx="200" cy="205" r="3.5" fill="#10B981"/>
      <!-- Laser Branding -->
      <text x="200" y="224" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">BLUECLOUDS</text>
      <text x="200" y="235" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#38BDF8" text-anchor="middle">ANC 35dB · BLUETOOTH 5.3</text>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Tai Nghe TWS Khử Ồn 35dB</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">189.000 ₫</text>
</svg>
