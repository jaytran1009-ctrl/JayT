<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#4F46E5"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SHIN CASE</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Phụ kiện điện thoại</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-privacy-glass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E1B4B"/>
          <stop offset="50%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <radialGradient id="g-glow-14" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(79, 70, 229, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-14)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Orange Alignment Tray Frame Behind -->
      <rect x="140" y="85" width="120" height="210" rx="20" fill="#EA580C" stroke="#C2410C" stroke-width="2.5"/>
      <text x="200" y="102" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AUTO-ALIGN TRAY</text>
      <!-- Tempered Glass Layer (Dark Privacy Tint) -->
      <rect x="150" y="105" width="100" height="180" rx="16" fill="url(#g-privacy-glass)" stroke="#818CF8" stroke-width="2"/>
      <!-- Dynamic Island / Speaker cutout -->
      <rect x="185" y="112" width="30" height="7" rx="3.5" fill="#000000"/>
      <!-- Privacy Polarizing Grid Angle lines -->
      <line x1="160" y1="135" x2="240" y2="135" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
      <line x1="160" y1="155" x2="240" y2="155" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
      <line x1="160" y1="175" x2="240" y2="175" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
      <line x1="160" y1="195" x2="240" y2="195" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
      <line x1="160" y1="215" x2="240" y2="215" stroke="rgba(129, 140, 248, 0.2)" stroke-width="1"/>
      <!-- Privacy Shield Graphic Text -->
      <circle cx="200" cy="180" r="18" fill="rgba(79, 70, 229, 0.4)" stroke="#A5B4FC" stroke-width="1.5"/>
      <text x="200" y="186" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">🛡️</text>
      <text x="200" y="235" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">CHỐNG NHÌN TRỘM 28°</text>
      <text x="200" y="248" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#A5B4FC" text-anchor="middle">KHUNG TỰ DÁN 1-CHẠM</text>
      <path d="M154 115 L242 275" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Kính Cường Lực Khung Tự Dán</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">39.000 ₫</text>
</svg>
