<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#0284C7"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DHF18</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Cá nhân & Di chuyển</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-raincoat-clear" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
          <stop offset="50%" stop-color="rgba(186, 230, 253, 0.35)"/>
          <stop offset="100%" stop-color="rgba(125, 211, 252, 0.5)"/>
        </linearGradient>
        <radialGradient id="g-glow-3" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(14, 165, 233, 0.25)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="120" ry="90" fill="url(#g-glow-3)"/>
      <ellipse cx="200" cy="315" rx="90" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Raincoat Hood -->
      <path d="M180 120 C180 90 220 90 220 120 Z" fill="url(#g-raincoat-clear)" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="200" cy="115" r="16" fill="rgba(255,255,255,0.2)" stroke="#7DD3FC" stroke-width="1.5"/>
      <!-- Drawstring cords -->
      <path d="M192 125 L190 145" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
      <path d="M208 125 L210 145" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
      <!-- Poncho Body -->
      <path d="M185 125 L120 220 L150 280 L200 275 L250 280 L280 220 L215 125 Z" fill="url(#g-raincoat-clear)" stroke="#38BDF8" stroke-width="2"/>
      <!-- Waterproof heat-sealed seams -->
      <path d="M200 125 L200 275" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4,3"/>
      <!-- Raindrop Water Beads -->
      <circle cx="165" cy="180" r="3.5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="230" cy="195" r="4" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="195" cy="235" r="3" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="220" cy="250" r="2.5" fill="#FFFFFF" opacity="0.9"/>
      <!-- Front Mirror/Headlight Clear Window Panel -->
      <path d="M170 170 L230 170 L220 215 L180 215 Z" fill="rgba(255,255,255,0.4)" stroke="#0284C7" stroke-width="1.5"/>
      <text x="200" y="196" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#0369A1" text-anchor="middle">WATERPROOF PVC</text>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Áo Mưa Cánh Dơi Trong Suốt 1 Người</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">39.000 ₫</text>
</svg>
