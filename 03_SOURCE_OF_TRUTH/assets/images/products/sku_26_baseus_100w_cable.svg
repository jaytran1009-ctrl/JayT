<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Subtle Soft Drop Shadow Base -->
  <ellipse cx="200" cy="300" rx="90" ry="14" fill="rgba(229,195,120,0.12)"/>
  
  <!-- Top Brand &amp; Category Pill -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#F97316"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BASEUS</text>
  
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Cáp sạc</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    
      <!-- Baseus Braided 100W Type-C Cable -->
      <ellipse cx="200" cy="210" rx="60" ry="35" fill="none" stroke="#334155" stroke-width="10" stroke-dasharray="8 4"/>
      <!-- Type-C Metal Connector Head Left -->
      <rect x="135" y="170" width="25" height="14" rx="4" fill="#F97316"/>
      <rect x="122" y="172" width="13" height="10" rx="3" fill="#CBD5E1"/>
      <!-- Type-C Metal Connector Head Right -->
      <rect x="240" y="170" width="25" height="14" rx="4" fill="#F97316"/>
      <rect x="265" y="172" width="13" height="10" rx="3" fill="#CBD5E1"/>
      <text x="200" y="215" font-family="sans-serif" font-size="14" font-weight="900" fill="#F97316" text-anchor="middle">100W</text>
    
  </g>
  
  <!-- Bottom Model Plate -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Type-C 100W (Braided 1.2M)</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F97316" text-anchor="end">89.000 ₫</text>
</svg>
