<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Neutral Studio Background: 100% Transparent -->
  <rect width="400" height="400" rx="24" fill="none"/>
  
  <!-- Top Brand & Category Header -->
  <rect x="24" y="24" width="130" height="30" rx="8" fill="#10B981"/>
  <text x="89" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TRẦN HÀ LINH</text>
  <text x="376" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A3B1A8" text-anchor="end">Học tập & Công nghệ</text>
  
  <!-- Centered Product Vector Illustration -->
  <g>
    <defs>
        <linearGradient id="g-speaker-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1E293B"/>
          <stop offset="50%" stop-color="#0F172A"/>
          <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <radialGradient id="g-glow-20" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(16, 185, 129, 0.3)"/>
          <stop offset="100%" stop-color="rgba(10, 17, 13, 0)"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="210" rx="110" ry="90" fill="url(#g-glow-20)"/>
      <ellipse cx="200" cy="315" rx="80" ry="14" fill="rgba(10,17,13,0.85)"/>
      <!-- Top Carabiner Metal Clip & Fabric Loop -->
      <rect x="195" y="90" width="10" height="20" rx="2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
      <path d="M192 90 C180 60 220 60 208 90" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <!-- Cylindrical / Pebble Speaker Body -->
      <rect x="150" y="105" width="100" height="165" rx="26" fill="url(#g-speaker-mesh)" stroke="#10B981" stroke-width="2.5"/>
      <!-- Acoustic Fabric Woven Grid Texture -->
      <circle cx="200" cy="165" r="32" fill="#000000" stroke="#334155" stroke-width="2"/>
      <circle cx="200" cy="165" r="16" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="200" cy="165" r="6" fill="#10B981"/>
      <!-- Tactile Volume & Play Buttons -->
      <text x="175" y="235" font-family="sans-serif" font-size="14" font-weight="900" fill="#E2E8F0" text-anchor="middle">-</text>
      <text x="200" y="235" font-family="sans-serif" font-size="12" font-weight="900" fill="#10B981" text-anchor="middle">▶</text>
      <text x="225" y="235" font-family="sans-serif" font-size="14" font-weight="900" fill="#E2E8F0" text-anchor="middle">+</text>
      <text x="200" y="258" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#94A3B8" text-anchor="middle" letter-spacing="1">BLUETOOTH 5.0</text>
  </g>
  
  <!-- Bottom Model & Floor Price Bar -->
  <rect x="24" y="340" width="352" height="36" rx="8" fill="rgba(10,17,13,0.85)" stroke="rgba(229,195,120,0.3)" stroke-width="1"/>
  <text x="36" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F4EFE6">Loa Mini Bluetooth Có Móc Treo</text>
  <text x="364" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">68.000 ₫</text>
</svg>
