    <text x="65" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">TRÀ &amp; GIẢI KHÁT</text>
  </g>

  <g transform="translate(320, 190) scale(1.4)" filter="url(#glow)">
    <g transform="translate(-40, -40)">
      <path d="M30 24 L50 24 L48 64 C48 68, 45 70, 40 70 C35 70, 32 68, 32 64 Z" fill="#D1FAE5" stroke="#ffffff" stroke-width="3"/>
