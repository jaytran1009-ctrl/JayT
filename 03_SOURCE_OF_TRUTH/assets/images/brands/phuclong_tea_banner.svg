  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="540" cy="80" r="140" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="100" cy="340" r="120" fill="#ffffff" fill-opacity="0.04"/>
  
  <g transform="translate(60, 48)">
