<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg_n_cine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg_n_cine)"/>
  
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.2"/>
    <text x="80" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">VÉ XEM PHIM U22</text>
  </g>
  <g transform="translate(430, 40)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#000000" fill-opacity="0.45"/>
    <text x="80" y="17" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HÌNH MINH HỌA CHUẨN</text>
  </g>

  <!-- Cinema Ticket Vector Icon -->
  <g transform="translate(320, 200) scale(1.3)">
    <rect x="-45" y="-30" width="90" height="60" rx="6" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="-45" cy="0" r="10" fill="#3730A3"/>
    <circle cx="45" cy="0" r="10" fill="#3730A3"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <g transform="translate(50, 315)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Ưu Đãi Vé Xem Phim Sinh Viên Đà Nẵng</text>
    <text x="0" y="30" fill="#C7D2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Được thẩm định &amp; đối soát thực tế tại các cụm rạp</text>
  </g>
  <rect x="0" y="394" width="640" height="6" fill="#818CF8"/>
</svg>