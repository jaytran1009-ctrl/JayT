<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
      <defs>
        <linearGradient id="sandstone-sky" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc"/>
          <stop offset="60%" stop-color="#e0f2fe"/>
          <stop offset="100%" stop-color="#bae6fd"/>
        </linearGradient>
        <linearGradient id="museum-roof-cl" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0369a1"/>
          <stop offset="50%" stop-color="#0284c7"/>
          <stop offset="100%" stop-color="#0ea5e9"/>
        </linearGradient>
        <filter id="cham-shadow-cl" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0c4a6e" flood-opacity="0.18"/>
        </filter>
      </defs>
      
      <rect width="960" height="540" fill="url(#sandstone-sky)"/>
      <circle cx="480" cy="270" r="220" fill="#38bdf8" opacity="0.12"/>
      
      <!-- Top Badge -->
      <g transform="translate(250, 36)" filter="url(#cham-shadow-cl)">
        <rect width="460" height="46" rx="23" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
        <text x="230" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1">🏛️ DI SẢN VĂN HÓA &#8226; BẢO TÀNG CHĂM ĐÀ NẴNG</text>
      </g>
      
      <!-- Classic French-Cham Architectural Monument -->
      <g transform="translate(230, 150)" filter="url(#cham-shadow-cl)">
        <path d="M 0 160 L 0 80 L 250 0 L 500 80 L 500 160 Z" fill="url(#museum-roof-cl)"/>
        <rect x="20" y="140" width="460" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
        
        <!-- Arch Windows & Classical Columns -->
        <rect x="50" y="170" width="65" height="95" rx="32" fill="#bae6fd"/>
        <rect x="155" y="170" width="65" height="95" rx="32" fill="#bae6fd"/>
        <rect x="280" y="170" width="65" height="95" rx="32" fill="#bae6fd"/>
        <rect x="385" y="170" width="65" height="95" rx="32" fill="#bae6fd"/>
        
        <!-- Grand Central Doorway -->
        <rect x="218" y="160" width="64" height="130" rx="32" fill="#0284c7"/>
        <line x1="135" y1="140" x2="135" y2="290" stroke="#0369a1" stroke-width="8"/>
        <line x1="365" y1="140" x2="365" y2="290" stroke="#0369a1" stroke-width="8"/>
      </g>
      
      <!-- Bottom Narrative -->
      <text x="480" y="495" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
        Lưu giữ hơn 400 bảo vật sa thạch vô giá &#8226; Số 02 Đường 2 Tháng 9, Hải Châu
      </text>
    </svg>