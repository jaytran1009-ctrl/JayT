    <!-- Google Fonts Hoàng Gia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600;1,6..72,700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Newsreader', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-pill: 9999px;
            --radius-card: 20px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

            /* Khóa chặt 100% Bảng Màu Đen Quý Tộc Đồng Nhất */
            --bg-base: #080A10;
            --bg-surface: #0F121C;
            --bg-card: rgba(18, 22, 34, 0.85);
            --bg-card-hover: rgba(26, 32, 50, 0.98);
            
            --border-subtle: rgba(255, 255, 255, 0.09);
            --border-gold: rgba(212, 175, 55, 0.4);
            --border-gold-glow: rgba(212, 175, 55, 0.85);
            
            --text-heading: #FFFFFF;
            --text-body: #94A3B8;
            --text-muted: #64748B;
            --text-gold: #FCD34D;
            
            --brand-emerald: #10B981;
            --brand-gold: #D4AF37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background-color: #080A10 !important;
            color: #94A3B8 !important;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes toastIn { from { transform: translate(-50%, -25px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes marqueeScroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes goldShimmer { 0% { transform: translateX(-100%) rotate(30deg); } 100% { transform: translateX(200%) rotate(30deg); } }
        @keyframes radarBeacon { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 0; } 100% { transform: scale(0.95); opacity: 0; } }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeScroll 45s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }

        .noble-card {
            transition: var(--transition);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .noble-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-gold-glow) !important;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15) !important;
            background: var(--bg-card-hover) !important;
        }

        .gold-shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .gold-shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: goldShimmer 3.5s infinite;
        }

        input::placeholder { color: #64748B; font-size: 0.9rem; font-family: var(--font-sans); }
    </style>
</head>
