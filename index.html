    <!-- Google Fonts: Inter, Newsreader, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Newsreader', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-pill: 9999px;
            --radius-card: 20px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

            /* Dark Theme Default (Obsidian Luxury) */
            --bg-page: #09090D;
            --bg-surface: #121318;
            --bg-card: #171821;
            --bg-card-hover: #1F212E;
            --bg-tag: #232533;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(16, 185, 129, 0.45);
            --border-gold: rgba(245, 158, 11, 0.4);
            --text-heading: #FFFFFF;
            --text-body: #A1A7B8;
            --text-muted: #6B7280;
            --badge-green-bg: rgba(16, 185, 129, 0.15);
            --badge-green-text: #34D399;
            --accent-gold: #FBBF24;
            --accent-emerald: #10B981;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --header-bg: rgba(9, 9, 13, 0.88);
        }

        [data-theme="light"] {
            --bg-page: #F8FAFC;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F1F5F9;
            --bg-tag: #F1F5F9;
            --border: #E2E8F0;
            --border-hover: #10B981;
            --border-gold: rgba(217, 119, 6, 0.4);
            --text-heading: #0F172A;
            --text-body: #475569;
            --text-muted: #94A3B8;
            --badge-green-bg: #ECFDF5;
            --badge-green-text: #059669;
            --accent-gold: #D97706;
            --accent-emerald: #059669;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --header-bg: rgba(255, 255, 255, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-page);
            color: var(--text-body);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 5rem;
            transition: var(--transition);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes toastIn { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes marqueeScroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes shimmerSweep { 0% { transform: translateX(-100%) rotate(25deg); } 100% { transform: translateX(200%) rotate(25deg); } }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeScroll 35s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }

        .deal-card-visual {
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .deal-card-visual:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover) !important;
            box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 20px rgba(16,185,129,0.15) !important;
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(25deg);
            animation: shimmerSweep 3s infinite;
        }

        input::placeholder { color: #64748B; font-size: 0.9rem; }
    </style>
</head>
