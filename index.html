                renderApp();
            } else if (e.target.id === 'calcMealInput') {
                State.calcMeal = parseInt(e.target.value, 10);
                renderApp();
            } else if (e.target.id === 'calcRideInput') {
                State.calcRide = parseInt(e.target.value, 10);
                renderApp();
            }
        });

        // Polling Realtime
        async function syncRealtime() {
            try {
                const res = await fetch('/api/deals', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.deals) && data.deals.length > 0) {
                        State.deals = data.deals;
                        State.radarScanCount += Math.floor(Math.random() * 3) + 1;
                        const d = new Date();
                        State.lastUpdatedTime = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
                        renderApp();
                    }
                }
            } catch (err) {
                console.warn("Realtime sync warning:", err);
            }
        }

        renderApp();
        setInterval(syncRealtime, 20000);
    })();
    </script>
</body>
</html>
