<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JayT Đà Nẵng — Hệ Điều Hành Săn Kèo & Voucher Bản Địa 43</title>
  <meta name="description" content="Hệ điều hành săn kèo, voucher ẩn và tối ưu chi tiêu bản địa Đà Nẵng 43. Không cần xem nhiều, chỉ cần săn đúng." />
  <meta name="theme-color" content="#0B0F19" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #0B0F19;
      color: #94A3B8;
      overflow-x: hidden;
    }
    input[type="range"] {
      -webkit-appearance: none;
      height: 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #10B981;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
    .aura-priority {
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.18), inset 0 0 20px rgba(245, 158, 11, 0.05);
      animation: auraPulse 3.5s infinite ease-in-out;
    }
    @keyframes auraPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.15); }
      50% { box-shadow: 0 0 55px rgba(245, 158, 11, 0.35); }
    }
  </style>
</head>
<body>

  <!-- ROOT CONTAINER CHO APEX ENGINE -->
  <div id="jaytAppRoot"></div>

  <!-- SCRIPT ENGINE APEX NÂNG CẤP -->
  <script src="jayt_runtime_adapter.js"></script>
</body>
</html>
