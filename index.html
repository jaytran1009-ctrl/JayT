    <!-- Google Fonts: Inter, Newsreader, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Newsreader', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-pill: 9999px;
            --radius-card: 16px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

            /* Dark Theme Default */
            --bg-page: #09090B;
            --bg-surface: #121215;
            --bg-card: #18181B;
            --bg-card-hover: #222226;
            --bg-tag: #27272A;
            --border: #27272A;
            --border-hover: #3F3F46;
            --text-heading: #FAFAFA;
            --text-body: #A1A1AA;
            --text-muted: #71717A;
            --btn-primary-bg: #FAFAFA;
            --btn-primary-text: #09090B;
            --btn-primary-hover: #E4E4E7;
            --badge-green-bg: rgba(16, 185, 129, 0.15);
            --badge-green-text: #34D399;
            --accent-gold: #FBBF24;
            --accent-red: #EF4444;
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --header-bg: rgba(9, 9, 11, 0.92);
        }

        [data-theme="light"] {
            --bg-page: #F8F9FA;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F4F4F5;
            --bg-tag: #F4F4F5;
            --border: #E4E4E7;
            --border-hover: #D4D4D8;
            --text-heading: #09090B;
            --text-body: #52525B;
            --text-muted: #A1A1AA;
            --btn-primary-bg: #09090B;
            --btn-primary-text: #FAFAFA;
            --btn-primary-hover: #27272A;
            --badge-green-bg: #ECFDF5;
            --badge-green-text: #059669;
            --accent-gold: #D97706;
            --accent-red: #DC2626;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --header-bg: rgba(248, 249, 250, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background-color: var(--bg-page);
            color: var(--text-body);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 5rem;
            transition: var(--transition);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes toastIn { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes marqueeScroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

        .marquee-track {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeScroll 35s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }

        .deal-card-luxury {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .deal-card-luxury:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0,0,0,0.35);
        }
        input::placeholder { color: #94A3B8; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- ĐIỂM GẮN DUY NHẤT CỦA CẢ HỆ THỐNG RUNTIME APEX (APP MOUNT POINT) -->
